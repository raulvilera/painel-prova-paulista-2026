<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Resultados · Missão SARESP 3D</title>
<link rel="stylesheet" href="../dash.css?v=13">
<style>
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:1.6rem}.kpi span{color:var(--muted);font-size:.8rem}
tr.al{cursor:pointer}tr.al:hover td{background:var(--surface-2)}
table{border-collapse:collapse}.turma-bloco{margin-top:26px;padding-top:6px;border-top:4px solid var(--accent)}.turma-tit{margin:12px 0 8px;font-size:1.5rem;color:var(--accent)}
td,th{padding:7px 8px;border:1px solid rgba(148,163,184,.6);vertical-align:middle;text-align:center}th{background:var(--surface-2)}td.l{text-align:left}
.det td{background:var(--surface-2);text-align:left}.nota{font-size:.82rem;color:var(--muted);margin:8px 0}
.btn{font:inherit;font-weight:600;color:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.scroll{overflow-x:auto}.scroll.fixo{max-height:calc(100vh - 70px);overflow:auto}.scroll.fixo>table>tbody>tr:first-child>th,.scroll.fixo>table>thead>tr>th{position:sticky;top:0;z-index:3;box-shadow:inset 0 -2px 0 rgba(148,163,184,.7)}input[type=search]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:210px}
.nt{font-weight:800}.nt.b{color:var(--lv0)}.nt.m{color:var(--lv1)}.nt.a{color:var(--lv2)}.ok{color:var(--lv2);font-weight:700}.er{color:var(--lv0);font-weight:700}
.tag{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.tbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:1;min-width:80px;display:block}.tbar>b{display:block;height:100%}
.faltam{display:flex;flex-wrap:wrap;gap:6px}.faltam span{font-size:.8rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1>Resultados · Missão SARESP 3D</h1><div class="muted sm">Simulador de Ciências 6º ao 9º ano · quiz por tema, Simulado SARESP, revisão da recuperação e desafio · atualiza a cada 20 s</div></div>
<nav><a href="/">← Painel</a><a href="/missao-saresp/professor/">👩‍🏫 Painel do professor</a><a href="/missao-saresp/turmas/">🔗 Links por turma</a><a href="/missao-saresp/" target="_blank" rel="noopener">Abrir o simulador →</a></nav></header>
<div class="filters">
<div class="field"><label for="fTurma">Turma</label><select id="fTurma"><option value="">Todas as turmas</option><option>6º Ano A (Lydia)</option><option>6º Ano B (Lydia)</option><option>6º Ano C (Lydia)</option><option>6º Ano A</option><option>6º Ano C</option><option>7º Ano A</option><option>7º Ano B</option><option>8º Ano A</option><option>8º Ano B</option><option>9º Ano A</option><option>9º Ano B</option></select></div>
<div class="field"><label for="fAtiv">Atividade</label><select id="fAtiv"><option value="">Todas</option><option value="simulado">Simulado SARESP</option><option value="recuperacao">Recuperação</option><option value="tema">Quiz por tema</option><option value="desafio">Desafio</option></select></div>
<div class="field"><label for="fAluno">Aluno</label><input id="fAluno" type="search" placeholder="Buscar pelo nome…" autocomplete="off"></div>
<div class="field"><button class="btn" id="bNotas" type="button">Baixar notas finais</button></div>
<div class="field"><button class="btn" id="bCsv" type="button">Baixar CSV (tentativas)</button></div>
<div class="field"><button class="btn" id="bAtu" type="button">Atualizar</button></div>
</div>
<div id="app"><div class="card muted">Carregando…</div></div>
</div>
<script>
(function () {
  const $ = s => document.querySelector(s), app = h => $('#app').innerHTML = h;
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dt = s => { try { return new Date(s).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
  const norm = v => String(v || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const fm = n => Number(n).toFixed(1).replace('.', ',');
  const nt = n => '<span class="nt ' + (n < 5 ? 'b' : n < 7 ? 'm' : 'a') + '">' + fm(n) + '</span>';
  const FAIXA = p => p < 25 ? ['Abaixo do Básico', 'var(--lv0)'] : p < 50 ? ['Básico', 'var(--lv1)'] : p < 75 ? ['Adequado', 'var(--lv2)'] : ['Avançado', 'var(--lv3)'];
  const TURMAS = ["6º Ano A (Lydia)", "6º Ano B (Lydia)", "6º Ano C (Lydia)", "6º Ano A", "6º Ano C", "7º Ano A", "7º Ano B", "8º Ano A", "8º Ano B", "9º Ano A", "9º Ano B"];
  const TEMA = {"6-AE1": "Esferas e camadas da Terra", "6-AE2": "Sol, Terra e Lua", "6-AE3": "Rochas, solo e fósseis", "6-AE5": "Células", "6-AE6": "Níveis de organização", "6-AE7": "Sistema nervoso", "7-AE1": "Placas tectônicas", "7-AE2": "Atmosfera e qualidade do ar", "7-AE3": "Máquinas simples", "7-AE7": "Efeito estufa", "7-AE8": "Vírus, bactérias e fungos", "7-AE10": "Biomas brasileiros", "7-AE11": "Vacinas e indicadores de saúde", "8-AE3": "ISTs e prevenção", "8-AE5": "Digestão e respiração", "8-AE8": "Fases da Lua, eclipses e estações", "8-AE9": "Clima e previsão do tempo", "8-AE10": "Mudanças climáticas", "8-AE11": "Fontes e transformações de energia", "8-AE12": "Circuitos elétricos", "8-AE13": "Consumo de energia", "9-AE2": "Modelos atômicos", "9-AE9": "Lamarck e Darwin", "9-AE10": "Evolução e biodiversidade", "9-AE11": "Problemas ambientais e UCs", "9-AE12": "Sistema Solar", "9-AE13": "Vida fora da Terra", "6-AE4": "Misturas e transformações", "7-AE4": "Calor e temperatura", "8-AE1": "Puberdade e sistema endócrino", "8-AE2": "Reprodução", "9-AE3": "Estados físicos da matéria", "9-AE4": "Reações químicas", "9-AE5": "Radiações eletromagnéticas", "9-AE6": "Ondas, luz e cores", "9-AE8": "Hereditariedade (Mendel)"};
  const ATIV = { simulado: 'Simulado SARESP', recuperacao: 'Recuperação', tema: 'Quiz do tema', desafio: 'Desafio' };
  let TOKEN = '', D = [], aberto = ''; const ROSTER = {};
  async function carregarRoster(t) { if (ROSTER[t]) return; try { const r = await fetch('/api/atividade-quimica?turma=' + encodeURIComponent(t), { cache: 'no-store' }); const j = await r.json(); ROSTER[t] = j.ok ? j.nomes.map(a => a.nome) : []; } catch (e) { ROSTER[t] = []; } }
  // D = resumo por aluno e seção (vem pronto do banco; não cresce com o número de tentativas). DET = tentativas de um aluno, carregadas ao abrir o nome.
  const DET = {};
  // seções da Missão por ano (os temas da trilha de cada ano + o Simulado final), na mesma ordem do link do aluno
  const SECOES = {
    6: ['6-AE1', '6-AE2', '6-AE3', '6-AE4', '6-AE5', '6-AE6', '6-AE7'],
    7: ['7-AE1', '7-AE2', '7-AE3', '7-AE4', '7-AE7', '7-INV', '7-AE8', '7-AE10', '7-AE11'],
    8: ['8-AE1', '8-AE2', '8-AE3', '8-AE5', '8-AE8', '8-AE9', '8-AE10', '8-AE11', '8-AE12', '8-AE13'],
    9: ['9-AE2', '9-AE3', '9-AE4', '9-AE5', '9-AE6', '9-AE8', '9-AE9', '9-AE10', '9-AE11', '9-AE12', '9-AE13']
  };
  TEMA['7-INV'] = TEMA['7-INV'] || 'Grupos de invertebrados';
  const nSecoes = t => (SECOES[String(t)[0]] || []).length + 1;
  // Nota final = soma da melhor nota de cada seção da Missão ÷ total de seções do ano (seção não feita conta 0).
  // Usa sempre todas as atividades do aluno, mesmo com o filtro de Atividade ligado.
  function notaFinal(t, nome) {
    const lista = SECOES[String(t)[0]] || [], sec = D.filter(x => x.turma === t && norm(x.nome) === norm(nome) && x.n_conc > 0);
    let soma = 0, feitas = 0;
    lista.forEach(c => { const x = sec.find(y => y.atividade === 'tema' && y.tema === c); if (x) { soma += Number(x.melhor); feitas++; } });
    const s = sec.find(y => y.atividade === 'simulado'); if (s) { soma += Number(s.melhor); feitas++; }
    return { nota: soma / nSecoes(t), feitas, total: nSecoes(t) };
  }
  async function carregar() {
    const r = await fetch('/api/quiz?missao3d=1', { headers: { Authorization: 'Bearer ' + TOKEN }, cache: 'no-store' });
    const j = await r.json(); if (!j.ok) throw new Error(j.erro || 'erro'); D = j.secoes || []; for (const k in DET) delete DET[k];
    const t = $('#fTurma').value; await Promise.all((t ? [t] : TURMAS).map(carregarRoster)); desenhar();
  }
  async function carregarAluno(t, nome) {
    const k = t + '|' + nome; if (DET[k]) return;
    DET[k] = 'carregando';
    try { const r = await fetch('/api/quiz?missao3d=1&turma=' + encodeURIComponent(t) + '&aluno=' + encodeURIComponent(nome), { headers: { Authorization: 'Bearer ' + TOKEN }, cache: 'no-store' });
      const j = await r.json(); DET[k] = j.ok ? j.tentativas : 'erro'; } catch (e) { DET[k] = 'erro'; }
    desenhar();
  }
  function bloco(t, L, qAluno) {
    const por = {}; L.forEach(x => { (por[x.nome] = por[x.nome] || []).push(x); });
    const nConc = L.reduce((a, x) => a + x.n_conc, 0), soma = L.reduce((a, x) => a + Number(x.soma_conc || 0), 0), media = nConc ? soma / nConc : null;
    const roster = ROSTER[t] || [], feitos = new Set(Object.keys(por).map(norm)), faltam = roster.filter(n => !feitos.has(norm(n)));
    let h = '<div class="kpis"><div class="kpi"><b>' + Object.keys(por).length + (roster.length ? '<span style="font-size:1rem"> / ' + roster.length + '</span>' : '') + '</b><span>alunos que fizeram alguma atividade</span></div><div class="kpi"><b>' + nConc + '</b><span>atividades concluídas</span></div><div class="kpi"><b>' + (media == null ? '–' : fm(media)) + '</b><span>média das concluídas</span></div><div class="kpi"><b>' + faltam.length + '</b><span>ainda não fizeram nada</span></div></div>';
    // aproveitamento por tema (todas as respostas de quiz)
    const T0 = {}; L.filter(x => x.atividade !== 'desafio').forEach(x => Object.entries(x.aes || {}).forEach(([ae, v]) => { const o = T0[ae] = T0[ae] || { ok: 0, er: 0 }; o.ok += v[0]; o.er += v[1]; }));
    const temas = Object.keys(T0).filter(k => T0[k].ok + T0[k].er).sort((a, b) => T0[a].ok / (T0[a].ok + T0[a].er) - T0[b].ok / (T0[b].ok + T0[b].er));
    h += '<div class="card"><h3>Aproveitamento por tema</h3><div class="nota">Acertos ÷ respostas de todos os alunos da turma, do tema mais frágil para o mais forte. Cores pelas faixas do painel.</div>' +
      (temas.length ? temas.map(k => { const o = T0[k], p = Math.round(o.ok / (o.ok + o.er) * 100), f = FAIXA(p); return '<div style="display:flex;align-items:center;gap:10px;margin:6px 0"><span style="min-width:240px"><b>' + esc(TEMA[k] || k) + '</b> <span class="muted sm">' + esc(k.replace('-', 'º · ')) + '</span></span><span class="tbar"><b style="width:' + p + '%;background:' + f[1] + '"></b></span><span style="min-width:150px">' + p + '% · ' + f[0] + ' <span class="muted sm">(' + o.ok + '/' + (o.ok + o.er) + ')</span></span></div>'; }).join('') : '<p class="muted">Ainda sem respostas de quiz.</p>') + '</div>';
    const alunos = Object.entries(por).map(([nome, sec]) => {
      const de = tipo => sec.find(x => x.atividade === tipo && x.n_conc > 0);
      const ns = sec.filter(x => x.n_conc > 0 && (x.atividade === 'tema' || x.atividade === 'simulado')).map(x => Number(x.melhor));
      const sim = de('simulado'), rec = de('recuperacao');
      return { nome, media: ns.length ? ns.reduce((a, b) => a + b, 0) / ns.length : null, nsec: ns.length, rapido: !!(sim && sim.rapido), sim: sim ? Number(sim.melhor) : null, rec: rec ? Number(rec.melhor) : null,
        temas: sec.filter(x => x.atividade === 'tema' && x.n_conc > 0).length, n: sec.reduce((a, x) => a + x.n_tent, 0), ult: sec.map(x => x.ult).sort().pop(), fin: notaFinal(t, nome) }; })
      .concat(faltam.filter(n => !qAluno || norm(n).includes(qAluno)).map(nome => ({ nome, nada: true, media: null, nsec: 0, sim: null, rec: null, temas: 0, n: 0, ult: null, fin: { nota: 0, feitas: 0, total: nSecoes(t) } })))
      .sort((a, b) => a.nome.localeCompare(b.nome, 'pt'));
    const c = v => v == null ? '<span class="muted">–</span>' : nt(v);
    const detalhe = (t, a) => { const k = t + '|' + a.nome, d = DET[k];
      if (!d || d === 'carregando') { if (!d) carregarAluno(t, a.nome); return '<span class="muted">Carregando as atividades…</span>'; }
      if (d === 'erro') return '<span class="muted">Não foi possível carregar agora. Clique de novo no nome.</span>';
      const at = $('#fAtiv').value;
      return d.filter(x => !at || x.atividade === at).map(x => '<div style="margin-bottom:10px"><b>' + esc(ATIV[x.atividade] || x.atividade) + (x.tema ? ' · ' + esc(TEMA[x.tema] || x.tema) : '') + '</b> · ' + dt(x.atualizado) + ' · ' + (x.concluido ? 'concluída · ' + fm(x.acertos).replace(',0', '') + '/' + x.total + ' · nota ' + nt(Number(x.nota)) + ' · ' + FAIXA(x.percentual)[0] : '<span class="tag">incompleta</span> · ' + (x.respostas || []).length + ' de ' + x.total + ' respondidas · ' + (x.respostas || []).filter(r => r.ok).length + ' certas (sem nota até concluir)') + (x.concluido && x.iniciado_em ? ' · ' + Math.round((new Date(x.atualizado) - new Date(x.iniciado_em)) / 1000) + ' s' : '') +
        '<div class="sm" style="margin-top:4px">' + (x.respostas || []).map(r => '<span class="' + (r.ok ? 'ok' : 'er') + '">' + (r.ok ? '✔' : '✘') + '</span> ' + esc(r.p) + (r.r ? ' <span class="muted">→ ' + esc(r.r) + '</span>' : '')).join('<br>') + '</div></div>').join('') || '<span class="muted">Nenhuma atividade deste tipo.</span>'; };
    h += '<div class="card" style="margin-top:14px"><h2>Alunos</h2><div class="nota">Clique no nome para ver cada atividade e as respostas. <b>Média da Missão</b> = média da melhor nota de cada seção concluída (cada tema e o Simulado final). <b>Nota final</b> = soma da melhor nota de cada seção ÷ total de seções do ano (' + nSecoes(t) + ' no ' + esc(String(t)[0]) + 'º ano: ' + (nSecoes(t) - 1) + ' temas + Simulado); seção não feita conta 0. <b>Atividades</b> = seções que o aluno concluiu / total de seções da Missão (entre parênteses, quantas vezes ele abriu atividades, contando as refeitas). Simulado e Recuperação mostram a melhor nota concluída (0 a 10). ⚡ = Simulado respondido rápido demais (menos de 8 s por questão): provável chute.</div><div class="scroll fixo"><table><thead><tr><th>#</th><th>Aluno</th><th>Média da Missão</th><th>Simulado SARESP</th><th>Nota final</th><th>Recuperação</th><th>Temas concluídos</th><th>Atividades</th><th>Última</th></tr></thead><tbody>' +
      (alunos.length ? alunos.map((a, i) => { const k = t + '|' + a.nome; let r = '<tr class="al" data-k="' + esc(k) + '"><td>' + (i + 1) + '</td><td class="l"><b>' + esc(a.nome) + '</b>' + (a.nada ? ' <span class="tag">não fez</span>' : '') + '</td><td>' + c(a.media) + (a.nsec ? ' <span class="muted sm">(' + a.nsec + ' seç.)</span>' : '') + '</td><td>' + c(a.sim) + (a.rapido ? ' <span title="Respondido rápido demais: menos de 8 segundos por questão">⚡</span>' : '') + '</td><td>' + nt(a.fin.nota) + '</td><td>' + c(a.rec) + '</td><td>' + a.temas + '</td><td title="' + a.n + ' tentativa(s) no total, contando as refeitas e as não terminadas"><b>' + a.fin.feitas + '</b>/' + a.fin.total + (a.n > a.fin.feitas ? ' <span class="muted sm">(' + a.n + ' tent.)</span>' : '') + '</td><td>' + (a.ult ? dt(a.ult) : '<span class="muted">–</span>') + '</td></tr>';
        if (aberto === k && !a.nada) r += '<tr class="det"><td></td><td colspan="8">' + detalhe(t, a) + '</td></tr>';
        return r; }).join('') : '<tr><td colspan="9" class="muted">Nenhum aluno encontrado.</td></tr>') + '</tbody></table></div></div>';
    if (roster.length) h += '<div class="card" style="margin-top:14px"><h3>Ainda não fizeram nenhuma atividade (' + faltam.length + ')</h3>' + (faltam.length ? '<div class="faltam">' + faltam.map(n => '<span>' + esc(n) + '</span>').join('') + '</div>' : '<p class="ok">Toda a turma já participou!</p>') + '</div>';
    return '<section class="turma-bloco"><h2 class="turma-tit">' + esc(t) + '</h2>' + h + '</section>';
  }
  function desenhar() {
    const t = $('#fTurma').value, at = $('#fAtiv').value, q = norm($('#fAluno').value.trim());
    const LL = D.filter(x => (!t || x.turma === t) && (!at || x.atividade === at) && (!q || norm(x.nome).includes(q)));
    // sem filtro de atividade/aluno, todas as turmas aparecem — inclusive as que ainda não fizeram nada (todos com nota final 0)
    const turmas = t ? [t] : TURMAS.filter(tm => (!at && !q) || LL.some(x => x.turma === tm));
    app(turmas.length ? turmas.map(tm => bloco(tm, LL.filter(x => x.turma === tm), q)).join('') : '<div class="card muted">Nenhum resultado ainda. Os alunos entram no simulador, escolhem a turma e o nome, e cada atividade aparece aqui.</div>');
    document.querySelectorAll('tr.al').forEach(tr => tr.onclick = () => { aberto = aberto === tr.dataset.k ? '' : tr.dataset.k; if (aberto && DET[aberto] === 'erro') delete DET[aberto]; desenhar(); });
  }
  // planilha: uma linha por tentativa; busca turma por turma para cada resposta continuar pequena
  async function csv() {
    const t = $('#fTurma').value, b = $('#bCsv'), rot = b.textContent; b.disabled = true; b.textContent = 'Gerando…';
    try {
      const L = [['Turma', 'Aluno', 'Atividade', 'Tema', 'Concluída', 'Acertos', 'Total', 'Percentual', 'Nota', 'Faixa', 'Início', 'Atualizado']];
      for (const tm of (t ? [t] : TURMAS)) {
        const r = await fetch('/api/quiz?missao3d=1&csv=1&turma=' + encodeURIComponent(tm), { headers: { Authorization: 'Bearer ' + TOKEN }, cache: 'no-store' }); const j = await r.json(); if (!j.ok) throw new Error(j.erro || 'erro');
        j.tentativas.forEach(x => L.push([x.turma, x.nome, ATIV[x.atividade] || x.atividade, x.tema ? (TEMA[x.tema] || x.tema) : '', x.concluido ? 'sim' : 'não', fm(x.acertos), x.total, x.percentual + '%', fm(x.nota), FAIXA(x.percentual)[0], dt(x.iniciado_em), dt(x.atualizado)]));
      }
      const txt = '﻿' + L.map(l => l.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(';')).join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })); a.download = 'missao-saresp-3d' + (t ? '-' + norm(t).replace(/\W+/g, '-') : '') + '.csv'; a.click();
    } catch (e) { alert('Não foi possível gerar a planilha: ' + e.message); } finally { b.disabled = false; b.textContent = rot; }
  }
  $('#fTurma').onchange = () => { const t = $('#fTurma').value; (t ? carregarRoster(t) : Promise.resolve()).then(desenhar); };
  // planilha de notas: uma linha por aluno (lista da turma + quem aparece nos resultados), já com a nota final
  function csvNotas() {
    const t = $('#fTurma').value, L = [['Turma', 'Aluno', 'Nota final', 'Seções concluídas', 'Seções da Missão', 'Média da Missão', 'Simulado SARESP', 'Simulado rápido demais', 'Recuperação', 'Situação']];
    for (const tm of (t ? [t] : TURMAS)) {
      const nomes = new Map(); (ROSTER[tm] || []).forEach(n => nomes.set(norm(n), n)); D.filter(x => x.turma === tm).forEach(x => { if (!nomes.has(norm(x.nome))) nomes.set(norm(x.nome), x.nome); });
      [...nomes.values()].sort((a, b) => a.localeCompare(b, 'pt')).forEach(nome => {
        const sec = D.filter(x => x.turma === tm && norm(x.nome) === norm(nome)), f = notaFinal(tm, nome), conc = sec.filter(x => x.n_conc > 0 && (x.atividade === 'tema' || x.atividade === 'simulado')).map(x => Number(x.melhor));
        const sim = sec.find(x => x.atividade === 'simulado' && x.n_conc > 0), rec = sec.find(x => x.atividade === 'recuperacao' && x.n_conc > 0);
        L.push([tm, nome, fm(f.nota), f.feitas, f.total, conc.length ? fm(conc.reduce((a, b) => a + b, 0) / conc.length) : '', sim ? fm(sim.melhor) : '', sim && sim.rapido ? 'sim' : '', rec ? fm(rec.melhor) : '', !sec.length ? 'não fez' : f.feitas < f.total ? 'incompleta' : 'completa']);
      });
    }
    const txt = '\ufeff' + L.map(l => l.map(c => '"' + String(c == null ? '' : c).replace(/"/g, '""') + '"').join(';')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'text/csv;charset=utf-8' })); a.download = 'missao-saresp-3d-notas' + (t ? '-' + norm(t).replace(/\W+/g, '-') : '') + '.csv'; a.click();
  }
  $('#bNotas').onclick = csvNotas;
  $('#fAtiv').onchange = desenhar; $('#fAluno').oninput = desenhar; $('#bCsv').onclick = csv;
  $('#bAtu').onclick = () => carregar().catch(e => app('<div class="card">' + esc(e.message) + '</div>'));
  { const t = new URLSearchParams(location.search).get('turma'); if (t && TURMAS.includes(t)) $('#fTurma').value = t; }
  function sessao() { try { const k = Object.keys(localStorage).find(x => /^sb-.*-auth-token$/.test(x)); if (!k) return null; const v = JSON.parse(localStorage.getItem(k) || 'null'); const s = v && (v.currentSession || v); return s && s.access_token ? s : null; } catch (e) { return null; } }
  (async function () {
    const ss = sessao();
    if (!ss) return app('<div class="card">Entre primeiro no painel com o seu login de professor. <a href="/">Abrir o painel</a></div>');
    if (ss.expires_at && ss.expires_at * 1000 < Date.now() + 30000) { app('<div class="card">Renovando o seu acesso…</div>'); return location.replace('/'); }
    TOKEN = ss.access_token;
    try { await carregar(); setInterval(() => { const n = sessao(); if (n) TOKEN = n.access_token; carregar().catch(() => {}); }, 20000); }
    catch (e) { app('<div class="card">' + (/professor|login|401/i.test(e.message) ? 'Seu acesso expirou. <a href="/">Voltar ao painel</a>' : 'Não foi possível carregar: ' + esc(e.message)) + '</div>'); }
  })();
})();
