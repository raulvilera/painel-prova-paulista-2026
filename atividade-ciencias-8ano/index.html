// ============================================================
// ESTADO E RENDERIZAÇÃO
// ============================================================
const estado = {};

// Questões que exigem resolução: recebem área de cálculos (rascunho, não é enviado)
const CALCULO = [4, 5, 6, 7];

function renderQuestoes() {
  const box = document.getElementById("questoes");
  for (const q of QUESTOES) {
    const sec = document.createElement("section");
    sec.className = "questao";
    const tipoTxt = q.tipo === "objetiva" ? "Objetiva" : "Dissertativa";
    let html = `<div class="meta"><span class="badge">Questão ${q.n}</span><span class="badge">${tipoTxt}</span>Habilidade: ${q.habilidade}</div>`;
    html += `<div class="enunciado">${q.enunciado}</div>`;
    html += `<div class="figura">${q.figura}</div>`;
    if (q.tipo === "objetiva") {
      html += '<div class="alternativas">' +
        q.alternativas.map((t, i) => {
          const L = "ABCDE"[i];
          return `<div class="alternativa" data-q="${q.n}" data-l="${L}" role="button" tabindex="0"><b>${L})</b> ${t}</div>`;
        }).join("") +
        "</div>";
    } else {
      html += `<textarea id="d${q.n}" placeholder="Escreva sua resposta aqui..."></textarea>`;
    }
    if (q.tipo === "objetiva" && CALCULO.includes(q.n)) {
      html += `<div class="calculo"><label for="c${q.n}">Espaço para cálculos (rascunho, não é enviado)</label><textarea id="c${q.n}" placeholder="Escreva aqui as contas que você fizer..."></textarea></div>`;
    }
    sec.innerHTML = html;
    box.appendChild(sec);
  }
  document.querySelectorAll(".alternativa").forEach(el => {
    el.addEventListener("click", () => marcar(el));
    el.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); marcar(el); }
    });
  });
}

function marcar(el) {
  const n = Number(el.dataset.q);
  document.querySelectorAll(`.alternativa[data-q="${n}"]`).forEach(x => x.classList.remove("selecionada"));
  el.classList.add("selecionada");
  estado[n] = el.dataset.l;
}

// ============================================================
// IDENTIFICAÇÃO EM CASCATA: Turma -> Nome -> RA
// ============================================================
const selTurma = document.getElementById("turma");
const selNome = document.getElementById("nome");
const inputChamada = document.getElementById("chamada");
const inputData = document.getElementById("data");

function limparCampos() {
  inputChamada.value = "";
}

function iniciarIdentificacao() {
  document.getElementById("escola").textContent = ESCOLA;
  // Data preenchida automaticamente com a data de hoje (horário de Brasília)
  inputData.value = new Date().toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" });
  selTurma.add(new Option("Selecione a turma", ""));
  Object.keys(TURMAS).forEach(t => selTurma.add(new Option(t, t)));

  selTurma.addEventListener("change", () => {
    selNome.innerHTML = "";
    selNome.add(new Option("Selecione seu nome", ""));
    (TURMAS[selTurma.value] || []).forEach((aluno, i) => selNome.add(new Option(aluno.n, i)));
    selNome.disabled = !selTurma.value;
    limparCampos();
  });

  selNome.addEventListener("change", () => {
    const aluno = (TURMAS[selTurma.value] || [])[parseInt(selNome.value, 10)];
    if (!aluno) { limparCampos(); return; }
    inputChamada.value = aluno.c;
  });
}

// ============================================================
// ENVIO PARA O GOOGLE SHEETS (via Apps Script)
// ============================================================
const btn = document.getElementById("btnEnviar");
const msg = document.getElementById("msg");

btn.addEventListener("click", async () => {
  const turma = selTurma.value;
  const aluno = (TURMAS[turma] || [])[parseInt(selNome.value, 10)];
  const nome = aluno ? aluno.n : "";
  const chamada = inputChamada.value;

  if (!turma || !nome) {
    msg.style.color = "#B00020";
    msg.textContent = "Selecione a sua turma e o seu nome antes de enviar.";
    return;
  }

  const respostas = {};
  QUESTOES.filter(q => q.tipo === "objetiva").forEach(q => { respostas[q.n] = estado[q.n] || ""; });

  const dissertativas = {};
  QUESTOES.filter(q => q.tipo === "dissertativa").forEach(q => {
    const el = document.getElementById("d" + q.n);
    dissertativas[q.n] = el ? el.value.trim() : "";
  });

  const payload = { escola: ESCOLA, turma, chamada, nome, respostas, dissertativas };

  btn.disabled = true;
  msg.style.color = "#1f3b57";
  msg.textContent = "Enviando...";

  try {
    const resp = await fetch(URL_ENVIO, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const dados = await resp.json().catch(() => ({}));
    if (!resp.ok || !dados.ok) throw new Error(dados.erro || "falha");
    msg.style.color = "#145A32";
    msg.textContent = "Respostas enviadas. Obrigado!";
  } catch (erro) {
    btn.disabled = false;
    msg.style.color = "#B00020";
    msg.textContent = "Não foi possível enviar. Verifique a conexão e tente de novo.";
  }
});

iniciarIdentificacao();
renderQuestoes();
</script>
