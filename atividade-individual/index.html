<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Minha atividade · Ciências</title>
<style>
  :root{--verde:#145A32;--fundo:#F3F6F2;--cartao:#FFFFFF;--tinta:#1B2420;--suave:#5A6660;--linha:#D5DCD7}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#1E5FA8 linear-gradient(180deg,#0A2150 0%,#164A94 45%,#5BA3E0 100%) fixed;color:var(--tinta);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:16px}
  header.cab{background:var(--verde);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px}
  .esc{font-weight:800;letter-spacing:.03em;font-size:1.1rem}
  header.cab h1{margin:6px 0 2px;font-size:1.3rem}
  .sub{opacity:.88;font-size:.92rem}
  .ident{background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:16px;display:grid;grid-template-columns:1.1fr 2fr .6fr 1fr;gap:12px;margin-bottom:16px}
  @media (max-width:720px){.ident{grid-template-columns:1fr 1fr}.ident .nome{grid-column:1 / -1}}
  .ident label{display:block;font-size:.78rem;font-weight:800;color:var(--suave);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
  .ident select,.ident input{width:100%;font:inherit;padding:10px;border:1px solid var(--linha);border-radius:10px;background:#fff;color:var(--tinta)}
  .ident input[readonly]{background:#EEF2EE;font-weight:700}
  .aviso{background:#FFF8E1;border:1px solid #F3D27A;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.92rem}
  .q{background:var(--cartao);border:1px solid var(--linha);border-radius:16px;padding:18px;margin-bottom:16px}
  .q .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .q .num{font-weight:800;color:var(--verde);margin-right:4px}
  .tag{font-size:.74rem;color:var(--suave);border:1px solid var(--linha);border-radius:999px;padding:1px 9px}
  .enun{margin:10px 0 6px}
  .infog{margin:8px 0 12px;padding:10px 12px;border:1px solid #D5DDD5;border-radius:10px;background:#F6F9F6}
  .infog figcaption{font-weight:700;font-size:.9rem;margin-bottom:8px}
  .infog table{width:100%;border-collapse:collapse;font-size:.9rem}.infog th,.infog td{border:1px solid #CBD5CB;padding:6px 8px;text-align:left}.infog th{background:#E3ECE3}
  .bars .b{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:.88rem}
  .bars .bt{height:16px;background:#E3ECE3;border-radius:4px;overflow:hidden}.bars .bt i{display:block;height:100%;background:#2E7D6B}
  .steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;counter-reset:s}
  .steps li{counter-increment:s;flex:1 1 130px;position:relative;padding:8px 10px 8px 34px;background:#fff;border:1px solid #CBD5CB;border-radius:8px;font-size:.88rem}
  .steps li::before{content:counter(s);position:absolute;left:8px;top:8px;width:20px;height:20px;border-radius:50%;background:#2E7D6B;color:#fff;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center}
  .fig{margin:10px 0 14px;background:#FAFBFA;border:1px solid var(--linha);border-radius:12px;padding:8px;display:flex;justify-content:center}
  .fig svg{width:100%;max-width:560px;height:auto;display:block}
  .cmd{font-weight:700;margin:0 0 10px}
  .alts{display:grid;gap:10px}
  .alternativa{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--tinta);background:#fff;border:1px solid #E3E7E4;border-radius:12px;padding:12px 14px;cursor:pointer;
    box-shadow:4px 4px 8px rgba(0,0,0,0.3),-2px -2px 6px rgba(255,255,255,0.6);transition:all .15s ease-in-out}
  .alternativa .l{font-weight:800;min-width:1.5em}
  .alternativa:focus-visible{outline:3px solid #7FB08F;outline-offset:2px}
  .alternativa.selecionada{box-shadow:inset 3px 3px 6px rgba(0,0,0,0.4);transform:translateY(2px);background-color:#145A32;color:#FFFFFF;font-weight:bold;border-color:#145A32}
  textarea{width:100%;min-height:130px;font:inherit;padding:12px;border:1px solid var(--linha);border-radius:12px;resize:vertical}
  .enviar{display:block;width:100%;font:inherit;font-weight:800;font-size:1.05rem;color:#fff;background:var(--verde);border:0;border-radius:14px;padding:16px;cursor:pointer;box-shadow:4px 4px 8px rgba(0,0,0,.3)}
  .enviar:disabled{opacity:.6;cursor:wait}
  .enviar[hidden]{display:none}
  .msg{margin:12px 0;padding:12px 14px;border-radius:12px;display:none}
  .msg.ok{display:block;background:#E3F1E7;border:1px solid #9FCDAE}
  .msg.erro{display:block;background:#FBE6E6;border:1px solid #E3A3A3}
  .vazio{text-align:center;color:#fff;padding:30px 10px}
  .foto{margin:10px 0 6px;border-radius:12px;overflow:hidden;border:1px solid var(--linha);background:#fff}
  .foto img{display:block;width:100%;max-height:340px;object-fit:cover;background:#E8ECE8}
  .q .foto img{object-fit:contain;background:#fff;max-height:340px}
  .foto .ph{display:none;padding:26px 10px;text-align:center;color:var(--suave)}
  .foto.carr .ph{display:block}.foto.carr img{height:0;opacity:0}
    .foto figcaption{font-size:.82rem;color:var(--suave);padding:6px 10px}
  .foto figcaption a{color:inherit}
  .codra{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--suave)}
  .codra[hidden]{display:none}
  .codra input{width:130px !important;text-transform:uppercase;letter-spacing:.1em}
  .codra button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 14px;background:var(--verde);color:#fff;cursor:pointer}
  .carreg{font-size:.8rem;color:var(--suave);margin-left:6px}
  .desc{background:#E8F3EC;border:1px solid #B9DCC5;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.92rem}
  .alternativa.certa{outline:3px solid #1E63B5}
  .feedback{margin-top:8px;font-size:.88rem;color:var(--suave)}
  /* ---- atividade adaptada (só aparece quando o servidor envia opções de acessibilidade) ---- */
  .agenda{position:sticky;top:0;z-index:5;background:#fff;border:1px solid var(--linha);border-radius:14px;padding:10px 14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .agenda[hidden]{display:none}
  .agenda .tx{font-weight:800;margin-bottom:6px}
  .agenda .pts{display:flex;gap:6px;flex-wrap:wrap}
  .agenda .pt{width:16px;height:16px;border-radius:50%;border:2px solid #9DB5A6;background:#fff}
  .agenda .pt.feito{background:#2E7D6B;border-color:#2E7D6B}
  .agenda .pt.atual{border-color:var(--verde);box-shadow:0 0 0 3px #B9DCC5}
  .ajuda{background:#E8F3EC;border:1px solid #B9DCC5;border-radius:12px;padding:10px 14px;margin-bottom:14px}
  .gloss{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:8px 14px;margin-bottom:14px}
  .gloss summary{font-weight:800;cursor:pointer}.gloss dt{font-weight:800;margin-top:6px}.gloss dd{margin:0 0 4px 0}
  .ferr{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
  .ferr button,.nav button,.pausa button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:#E8F3EC;color:var(--verde);border:2px solid #9DB5A6;min-height:48px}
  .ferr button.on{background:#FDECEC;color:#8A1F1F;border-color:#E3A3A3}
  .nav{display:flex;gap:10px;justify-content:space-between;margin:0 0 16px}
  .nav button.prim{background:var(--verde);color:#fff;border-color:var(--verde)}
  .nav button:disabled{opacity:.4;cursor:default}
  .nav[hidden],.pausa[hidden]{display:none}
  .pausa{background:#FFF8E1;border:2px solid #F3D27A;border-radius:16px;padding:22px;text-align:center;margin-bottom:16px}
  .pausa h2{margin:0 0 8px}
  .q[hidden]{display:none}
  html,body{overflow-x:hidden;max-width:100%}.q,.q *{min-width:0;max-width:100%;box-sizing:border-box}.q select,.q textarea{width:100%}.q{overflow-wrap:anywhere}
  .assoc{display:grid;gap:10px;margin-top:6px}
  .assoc .l{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,42%);gap:10px;align-items:center;background:#F6F9F6;border:1px solid var(--linha);border-radius:12px;padding:10px 12px}
  @media (max-width:560px){.assoc .l{grid-template-columns:1fr}}
  .assoc select{font:inherit;padding:12px;border:2px solid #9DB5A6;border-radius:10px;background:#fff;color:var(--tinta);min-height:48px}
  .ordem{display:grid;gap:10px;margin-top:6px}
  .carta{position:relative;text-align:left;font:inherit;color:var(--tinta);background:#fff;border:2px solid #9DB5A6;border-radius:12px;padding:14px 14px 14px 52px;cursor:pointer;min-height:52px}
  .carta .n{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;border:2px dashed #9DB5A6;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--verde)}
  .carta.esc{background:#145A32;color:#fff;border-color:#145A32}
  .carta.esc .n{background:#fff;border:2px solid #fff}
  .ordem-ferr{display:flex;gap:8px;margin-top:8px}
  .ordem-ferr button{font:inherit;font-weight:700;border:2px solid #9DB5A6;border-radius:10px;padding:8px 14px;background:#fff;cursor:pointer;min-height:44px}
  .adapt .alternativa{padding:16px 18px;min-height:56px}
  .adapt textarea{min-height:170px}
  .desafio .tag.des{background:#EDE7F6;border-color:#B8A4DC;color:#4A2C85}
  .gentil .sub-ok{color:#145A32;font-weight:800}

  /* ---- responsivo: celular, tablet e computador ---- */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  img,svg,video,table{max-width:100%}
  .wrap{padding:clamp(10px,3vw,24px);padding-left:max(clamp(10px,3vw,24px),env(safe-area-inset-left));padding-right:max(clamp(10px,3vw,24px),env(safe-area-inset-right))}
  .q{padding:clamp(14px,3.2vw,26px)}
  .enun{font-size:clamp(1.05rem,2.6vw + .5rem,1.35rem)}
  .foto img{aspect-ratio:auto;max-height:min(340px,48vh)}
  .foto figcaption{font-size:.72rem;line-height:1.3;padding:5px 9px;overflow-wrap:anywhere}
  .alternativa,.enviar,.assoc select,button{min-height:48px;touch-action:manipulation}
  .infog{overflow-x:auto}
  @media (min-width:721px) and (max-width:1024px){.wrap{max-width:760px}.alts{grid-template-columns:1fr 1fr}.assoc .l{grid-template-columns:minmax(0,1fr) minmax(0,45%)}}
  @media (min-width:1025px){.wrap{max-width:900px}}
  @media (max-width:480px){.ident{grid-template-columns:1fr}header.cab{padding:14px}header.cab h1{font-size:1.15rem}.alternativa{padding:12px}}
  @media (max-height:480px) and (orientation:landscape){.foto img{max-height:60vh}.wrap{padding-top:8px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="cab">
    <div class="esc" id="esc">Ciências · Ensino Fundamental</div>
    <h1>Minha atividade de Ciências</h1>
    <div class="sub" id="sub">Escolha a sua turma e o seu nome para abrir as questões preparadas para você.</div>
  </header>
  <section class="ident" aria-label="Identificação do aluno">
    <div><label for="turma">Turma</label><select id="turma"></select></div>
    <div class="nome"><label for="nome">Nome</label><select id="nome" disabled><option value="">Escolha a turma primeiro</option></select></div>
  </section>
  <div class="desc" id="desc" hidden></div>
  <div class="ajuda" id="ajuda" hidden></div>
  <details class="gloss" id="gloss" hidden></details>
  <div class="agenda" id="agenda" hidden aria-live="polite"></div>
  <div class="pausa" id="pausa" hidden><h2>⏸ Hora de uma pausa</h2><p>Respire fundo e beba um pouco de água. Quando estiver pronto, continue.</p><button type="button" id="pausaOk">Continuar</button></div>
  <div id="qs"></div>
  <div class="nav" id="nav" hidden><button type="button" id="ant">← Voltar</button><button type="button" class="prim" id="prox">Próxima →</button></div>
  <div class="msg" id="msg" role="status"></div>
  <button class="enviar" id="btn" type="button" hidden>Enviar respostas</button>
</div>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fT = $('#turma'), fN = $('#nome');
  let Q = [], resp = [];
  const URLP = new URLSearchParams(location.search), MODO = URLP.get('modo') === 'simulado' ? 'simulado' : '';
  if (MODO) { document.title = 'Simulado SARESP adaptado · Ciências'; const h = document.querySelector('header.cab h1'); if (h) h.textContent = 'Simulado SARESP · Ciências'; }
  const espera = ms => new Promise(r => setTimeout(r, ms));
  async function chama(opt, q){
    let ult;
    for (let k = 0; k < 3; k++) {
      try {
        const r = opt ? await fetch('/api/individual', opt) : await fetch('/api/individual?' + new URLSearchParams(q), { cache: 'no-store' });
        const j = await r.json(); if (!j.ok) throw Object.assign(new Error(j.erro || 'erro'), { srv: true }); return j;
      } catch (e) { ult = e; if (e.srv) throw e; await espera(1200 * (k + 1)); }
    }
    throw ult;
  }
  const get = q => chama(null, q);
  const post = body => chama({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const falha = e => e && e.srv ? e.message : 'sem conexão. Verifique a internet e tente de novo';
  const msg = (t, ok) => { const m = $('#msg'); m.className = 'msg ' + (ok ? 'ok' : 'erro'); m.textContent = t; m.scrollIntoView({behavior:'smooth', block:'center'}); };

  fT.innerHTML = '<option value="">Carregando…</option>'; fT.disabled = true;
  get({ acao: 'turmas' }).then(d => { fT.disabled = false; fT.innerHTML = '<option value="">Selecione</option>' + d.turmas.map(t => `<option>${esc(t)}</option>`).join('');
    const pt = URLP.get('t'); if (pt) { const kt = x => { const m = /(\d)\s*º?\s*ANO\s*([A-Z])\b/i.exec(String(x).normalize('NFD').replace(/[\u0300-\u036f]/g, '')); return m ? m[1] + m[2].toUpperCase() : x; }; const o = [...fT.options].find(x => x.value && kt(x.value) === kt(pt)); if (o) { fT.value = o.value; fT.onchange(); } } })
    .catch(e => { fT.innerHTML = '<option value="">Indisponível</option>'; msg('Não foi possível carregar as turmas: ' + falha(e) + '.', false); });
  let AD = null, cur = 0, enviado = false;   // AD = opções de acessibilidade (só para quem tem atividade adaptada)
  function zerar(){ Q = []; resp = []; AD = null; cur = 0; enviado = false; falaParar(); Object.keys(pausaFeita).forEach(k => delete pausaFeita[k]); $('#qs').innerHTML = ''; $('#desc').hidden = true; $('#btn').hidden = true; $('#msg').className = 'msg';
    ['ajuda','gloss','agenda','pausa','nav'].forEach(i => $('#' + i).hidden = true); document.documentElement.style.fontSize = ''; document.body.classList.remove('adapt','gentil','desafio'); }
  fT.onchange = () => {
    zerar(); fN.disabled = true; fN.innerHTML = '<option value="">Carregando nomes…</option>';
    if (!fT.value) { fN.innerHTML = '<option value="">Escolha a turma primeiro</option>'; return; }
    const t = fT.value;
    get({ acao: 'nomes', turma: t }).then(d => {
      if (fT.value !== t) return;
      fN.disabled = false; fN.innerHTML = '<option value="">Selecione o seu nome</option>' + d.nomes.map(n => `<option>${esc(n)}</option>`).join('');
      const pn = URLP.get('n'); if (pn) { const k = x => String(x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().split(/\s+/).filter(Boolean), kk = x => { const a = k(x); return a[0] + '|' + a[a.length - 1]; }; const o = [...fN.options].find(x => x.value && kk(x.value) === kk(pn)); if (o) { fN.value = o.value; URLP.delete('n'); fN.onchange(); } }
    }).catch(e => { fN.innerHTML = '<option value="">Nomes indisponíveis</option>'; msg('Não foi possível carregar os nomes: ' + falha(e) + '.', false); });
  };
  fN.onchange = () => {
    zerar(); if (!fN.value) return;
    const t = fT.value, n = fN.value;
    $('#qs').innerHTML = '<p class="vazio">Preparando as suas questões… na primeira vez pode levar até 1 minuto.</p>';
    get(Object.assign({ acao: 'atividade', turma: t, nome: n }, MODO ? { modo: MODO } : {})).then(a => {
      if (fT.value !== t || fN.value !== n) return;
      if (a.aviso || !a.itens.length) { $('#qs').innerHTML = `<p class="vazio">${esc(a.aviso || 'Sem atividade por enquanto.')}</p>`; return; }
      Q = a.itens; resp = Q.map(() => null); AD = a.adapt || null; cur = 0;
      $('#sub').textContent = `${a.nome.split(' ')[0]}, estas questões foram preparadas para você · ${Q.length} questões` + (AD && AD.semPressa ? ' · sem pressa, não há limite de tempo' : '');
      const ds = []; Q.forEach(q => { if (ds.indexOf(q.desc) < 0) ds.push(q.desc); });
      $('#desc').hidden = false; $('#desc').innerHTML = '<b>O que vamos estudar:</b><ul style="margin:6px 0 0 18px;padding:0">' + ds.map(d => `<li>${esc(d)}</li>`).join('') + '</ul>';
      prepararAdapt(); desenhar();
    }).catch(e => { $('#qs').innerHTML = `<p class="vazio">Não foi possível abrir a atividade: ${esc(falha(e))}.</p>`; });
  };

  /* ---------- adaptação: letra maior, uma questão por vez, agenda, pausas, voz, ditado ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, TTS = 'speechSynthesis' in window;
  function prepararAdapt(){
    if (!AD) return;
    document.body.classList.add('adapt'); if (AD.gentil) document.body.classList.add('gentil'); if (AD.desafio) document.body.classList.add('desafio');
    if (AD.fonte && AD.fonte > 1) document.documentElement.style.fontSize = (16 * AD.fonte) + 'px';
    if (AD.ajuda) { const j = $('#ajuda'); j.hidden = false; j.innerHTML = '💬 Se precisar, peça ajuda ao professor ou a um colega.' + (AD.voz && TTS && !AD.semVoz ? ' Toque em <b>🔊 Ouvir</b> para escutar a questão.' : ''); }
    if (AD.glossario && AD.glossario.length) { const g = $('#gloss'); g.hidden = false; g.innerHTML = '<summary>📖 Glossário (palavras importantes)</summary><dl>' + AD.glossario.map(x => `<dt>${esc(x.t)}</dt><dd>${esc(x.d)}</dd>`).join('') + '</dl>'; }
    if (AD.agenda) $('#agenda').hidden = false;
    if (AD.umPorVez) $('#nav').hidden = false;
  }
  function falaParar(){ try { if (TTS) speechSynthesis.cancel(); } catch (e) {} }
  function textoDaQuestao(i){
    const q = Q[i]; let t = q.enunciado + '. ' + (q.comando || '') + '. ';
    if (q.tipo === 'obj') t += q.alts.map((a, k) => 'Opção ' + 'ABCD'[k] + ': ' + a + '.').join(' ');
    if (q.tipo === 'assoc') t += q.linhas.map(l => l + '.').join(' ') + ' Opções: ' + q.banco.join(', ') + '.';
    if (q.tipo === 'ordem') t += q.passos.join('. ') + '.';
    return t.replace(/_{2,}/g, 'espaço em branco');
  }
  function fala(i){
    if (!TTS) return; falaParar();
    const u = new SpeechSynthesisUtterance(textoDaQuestao(i)); u.lang = 'pt-BR'; u.rate = 0.9; speechSynthesis.speak(u);
  }
  let rec = null, recQ = -1;
  function ditar(i, btn){
    if (!SR) return;
    if (rec) { try { rec.stop(); } catch (e) {} rec = null; document.querySelectorAll('[data-dit]').forEach(b => { b.classList.remove('on'); b.textContent = '🎤 Falar a resposta'; }); if (recQ === i) { recQ = -1; return; } }
    const ta = document.querySelector(`textarea[data-q="${i}"]`); recQ = i;
    rec = new SR(); rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = false;
    rec.onresult = ev => { let t = ''; for (let k = ev.resultIndex; k < ev.results.length; k++) if (ev.results[k].isFinal) t += ev.results[k][0].transcript + ' ';
      if (t) { ta.value = (ta.value ? ta.value.replace(/\s*$/, ' ') : '') + t.trim(); resp[i] = ta.value; } };
    rec.onend = () => { btn.classList.remove('on'); btn.textContent = '🎤 Falar a resposta'; rec = null; recQ = -1; };
    rec.onerror = () => { btn.classList.remove('on'); btn.textContent = '🎤 Falar a resposta'; rec = null; recQ = -1; };
    btn.classList.add('on'); btn.textContent = '⏹ Parar de gravar'; try { rec.start(); } catch (e) {}
  }

  /* infográfico opcional da questão (tabela, barras ou etapas), desenhado a partir de dados validados no servidor */
  function figura(f){
    if(!f) return '';
    const cap = f.titulo ? `<figcaption>${esc(f.titulo)}</figcaption>` : '';
    if(f.tipo === 'tabela') return `<figure class="infog">${cap}<table><thead><tr>${f.colunas.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${f.linhas.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></figure>`;
    if(f.tipo === 'barras'){
      const max = Math.max(...f.itens.map(i => i.valor)) || 1;
      return `<figure class="infog">${cap}<div class="bars" role="img" aria-label="${esc(f.titulo || 'Gráfico de barras')}">${f.itens.map(i => `<div class="b"><span class="bn">${esc(i.rotulo)}</span><span class="bt"><i style="width:${Math.max(3, i.valor / max * 100)}%"></i></span><span class="bv">${esc(String(i.valor).replace('.', ','))}${f.unidade ? ' ' + esc(f.unidade) : ''}</span></div>`).join('')}</div></figure>`;
    }
    if(f.tipo === 'etapas') return `<figure class="infog">${cap}<ol class="steps">${f.etapas.map(e => `<li>${esc(e)}</li>`).join('')}</ol></figure>`;
    return '';
  }
  const ROT = { obj: 'Objetiva', dis: 'Dissertativa', assoc: 'Ligar / completar', ordem: 'Colocar em ordem' };
  function corpo(q, i){
    if (q.tipo === 'obj') return `<div class="alts" role="radiogroup" aria-label="Alternativas da questão ${i+1}">${q.alts.map((t, k) => `<button type="button" class="alternativa" role="radio" aria-checked="false" data-q="${i}" data-k="${k}"><span class="l">${'ABCD'[k]}</span><span>${esc(t)}</span></button>`).join('')}</div>`;
    if (q.tipo === 'assoc') return `<div class="assoc">${q.linhas.map((l, j) => `<div class="l"><span>${esc(l)}</span><select data-q="${i}" data-l="${j}" aria-label="${esc(l)}"><option value="">Escolha…</option>${q.banco.map((b, k) => `<option value="${k}">${esc(b)}</option>`).join('')}</select></div>`).join('')}</div>`;
    if (q.tipo === 'ordem') return `<div class="ordem" data-ordem="${i}">${q.passos.map((p, k) => `<button type="button" class="carta" data-q="${i}" data-p="${k}"><span class="n"></span>${esc(p)}</button>`).join('')}</div><div class="ordem-ferr"><button type="button" data-desfaz="${i}">↩ Desfazer</button><button type="button" data-zera="${i}">Recomeçar</button></div>`;
    const dit = AD && AD.ditado && SR && !AD.semVoz ? `<div class="ferr"><button type="button" data-dit="${i}">🎤 Falar a resposta</button></div>` : '';
    return `${dit}<textarea data-q="${i}" aria-label="Resposta da questão ${i+1}" placeholder="${AD && AD.ditado ? 'Fale no microfone ou escreva aqui.' : 'Escreva sua resposta com as suas palavras.'}"></textarea>`;
  }
  function desenhar(){
    $('#qs').innerHTML = Q.map((q, i) => `
      <article class="q" id="q${i}">
        <div class="top"><span class="num">Questão ${i+1}</span><span class="tag">${ROT[q.tipo] || 'Questão'}</span>${AD && AD.desafio && q.tipo === 'dis' ? '<span class="tag des">Desafio</span>' : ''}</div>
        <p class="enun">${esc(q.enunciado)}</p>
        ${figura(q.figura)}
        ${q.imagem ? `<figure class="foto carr"><span class="ph">🖼️ Carregando a imagem…</span><img src="${esc(q.imagem)}" alt="${esc(q.imagemAlt || 'Imagem da questão')}" loading="lazy"></figure>` : ''}
        <p class="cmd">${esc(q.comando)}</p>
        ${AD && AD.voz && !AD.semVoz && TTS ? `<div class="ferr"><button type="button" data-ouvir="${i}">🔊 Ouvir a questão</button></div>` : ''}
        ${corpo(q, i)}
        <div class="feedback" id="fb${i}"></div>
      </article>`).join('');
    mostrar(0);
  }
  /* estado visual: questão atual, agenda, botões */
  function respondida(i){ const r = resp[i]; if (Array.isArray(r)) return r.some(v => v !== null && v !== '' && v !== undefined); return !(r === null || r === undefined || r === ''); }
  function mostrar(i, ouvir){
    cur = Math.max(0, Math.min(Q.length - 1, i));
    const um = AD && AD.umPorVez;
    Q.forEach((_, k) => { const a = $('#q' + k); if (a) a.hidden = um ? k !== cur : false; });
    if (AD && AD.agenda) $('#agenda').innerHTML = `<div class="tx">${um ? `Questão ${cur + 1} de ${Q.length}` : `Você tem ${Q.length} questões`}</div><div class="pts" aria-hidden="true">${Q.map((_, k) => `<span class="pt${respondida(k) ? ' feito' : ''}${um && k === cur ? ' atual' : ''}"></span>`).join('')}</div>`;
    const ult = cur === Q.length - 1;
    if (um) { $('#ant').disabled = cur === 0; $('#prox').hidden = ult; $('#btn').hidden = !(ult && !enviado); }
    else $('#btn').hidden = enviado;
    if (!enviado) { $('#btn').disabled = false; $('#btn').textContent = 'Enviar respostas'; }
    if (um) { const a = $('#q' + cur); if (a && ouvir !== false) a.scrollIntoView({ behavior: 'smooth', block: 'start' }); if (AD.vozAuto && ouvir !== false && !enviado) fala(cur); }
  }
  function irPara(i){
    falaParar();
    if (AD && AD.pausaA && i > cur && i % AD.pausaA === 0 && !enviado && !pausaFeita[i]) {   // pausa curta a cada N questões
      pausaFeita[i] = 1; $('#qs').hidden = true; $('#nav').hidden = true; $('#pausa').hidden = false; $('#pausaOk').onclick = () => { $('#pausa').hidden = true; $('#qs').hidden = false; $('#nav').hidden = false; mostrar(i); }; return;
    }
    mostrar(i);
  }
  const pausaFeita = {};
  $('#ant').onclick = () => irPara(cur - 1);
  $('#prox').onclick = () => irPara(cur + 1);

  /* ---------- respostas ---------- */
  /* imagem gerada na primeira vez (pode levar alguns segundos): mostra "preparando", tenta de novo uma vez e some se não der */
  document.addEventListener('load', e => { const f = e.target.closest && e.target.closest('.foto'); if (f && e.target.tagName === 'IMG') { f.classList.remove('carr'); if (!f.querySelector('figcaption')) fetch(e.target.src.split('&r=')[0] + '&meta=1').then(r => r.json()).then(j => { if (j && j.credito && !f.querySelector('figcaption')) { const c = document.createElement('figcaption'); if (j.fonte && /^https:\/\/commons\.wikimedia\.org\//.test(j.fonte)) { const a = document.createElement('a'); a.href = j.fonte; a.target = '_blank'; a.rel = 'noopener'; a.textContent = j.credito; c.appendChild(a); } else c.textContent = j.credito; f.appendChild(c); } }).catch(() => {}); } }, true);
  document.addEventListener('error', e => { const im = e.target; if (!im || im.tagName !== 'IMG' || !im.closest('.foto')) return;
    const n = +im.dataset.r || 0; if (n < 2) { im.dataset.r = String(n + 1); setTimeout(() => { im.src = im.src.split('&r=')[0] + '&r=' + Date.now(); }, 4000); } else { const f = im.closest('.foto'); if (f) { const ph = f.querySelector('.ph'); fetch(im.src.split('&r=')[0]).then(r => r.text()).then(t => { let m = t; try { m = JSON.parse(t).erro || t; } catch (x) { /* texto */ } if (ph) ph.textContent = '⚠️ Imagem indisponível: ' + String(m).slice(0, 400); }).catch(x => { if (ph) ph.textContent = '⚠️ Imagem indisponível (sem conexão com o servidor): ' + x; }); } } }, true);
  document.addEventListener('click', e => {
    const o = e.target.closest('[data-ouvir]'); if (o) { fala(+o.dataset.ouvir); return; }
    const d = e.target.closest('[data-dit]'); if (d) { ditar(+d.dataset.dit, d); return; }
    const dz = e.target.closest('[data-desfaz]'), zr = e.target.closest('[data-zera]');
    if (dz || zr) { const i = +(dz ? dz.dataset.desfaz : zr.dataset.zera); if (enviado) return; const r = Array.isArray(resp[i]) ? resp[i] : [];
      if (dz) r.pop(); else r.length = 0; resp[i] = r.length ? r : null; marcarOrdem(i); mostrar(cur, false); return; }
    const c = e.target.closest('.carta'); if (c) { if (enviado) return; const i = +c.dataset.q, p = +c.dataset.p; const r = Array.isArray(resp[i]) ? resp[i] : [];
      if (r.indexOf(p) < 0) { r.push(p); resp[i] = r; marcarOrdem(i); mostrar(cur, false); } return; }
    const b = e.target.closest('.alternativa'); if (!b || enviado) return;
    const i = +b.dataset.q, k = +b.dataset.k; resp[i] = k;
    document.querySelectorAll(`.alternativa[data-q="${i}"]`).forEach(x => { const on = x === b; x.classList.toggle('selecionada', on); x.setAttribute('aria-checked', on); });
    if (AD && AD.agenda) mostrar(cur, false);
  });
  function marcarOrdem(i){
    const r = Array.isArray(resp[i]) ? resp[i] : [];
    document.querySelectorAll(`.carta[data-q="${i}"]`).forEach(x => { const pos = r.indexOf(+x.dataset.p); x.classList.toggle('esc', pos >= 0); x.querySelector('.n').textContent = pos >= 0 ? pos + 1 : ''; });
  }
  document.addEventListener('input', e => { if (e.target.matches('textarea[data-q]')) { resp[+e.target.dataset.q] = e.target.value; if (AD && AD.agenda) mostrar(cur, false); } });
  document.addEventListener('change', e => {
    if (!e.target.matches('select[data-l]') || enviado) return;
    const i = +e.target.dataset.q, l = +e.target.dataset.l, n = Q[i].linhas.length; const r = Array.isArray(resp[i]) ? resp[i] : new Array(n).fill(null);
    r[l] = e.target.value === '' ? null : +e.target.value; resp[i] = r; if (AD && AD.agenda) mostrar(cur, false);
  });

  /* ---------- envio ---------- */
  $('#btn').onclick = () => {
    if (!fT.value || !fN.value || !Q.length) return msg('Escolha a sua turma e o seu nome.', false);
    const falta = resp.map((r, i) => respondida(i) ? 0 : i + 1).filter(Boolean);
    if (falta.length && !confirm((AD && AD.gentil ? 'Ainda dá tempo! Você não respondeu a questão ' : 'Faltam as questões ') + falta.join(', ') + '. ' + (AD && AD.gentil ? 'Quer enviar assim mesmo?' : 'Enviar mesmo assim?'))) return;
    falaParar(); const b = $('#btn'); b.disabled = true; b.textContent = 'Enviando e corrigindo…';
    post(Object.assign({ acao: 'enviar', turma: fT.value, nome: fN.value, respostas: resp }, MODO ? { modo: MODO } : {})).then(r => {
      enviado = true; b.textContent = 'Respostas enviadas ✓';
      const gent = !!(AD && AD.gentil);
      let oi = 0, di = 0;
      Q.forEach((q, i) => {
        const fb = $('#fb' + i);
        if (q.tipo === 'dis') { const nt = (r.notasDis || [])[di++]; if (nt !== '' && nt != null) fb.textContent = gent ? '⭐ Obrigado por responder! Sua resposta foi registrada.' : 'Nota da IA: ' + String(nt).replace('.', ',') + ' de 1'; return; }
        const g = (r.gabarito || [])[oi++]; if (!g) return;
        if (q.tipo === 'obj') {
          const bt = document.querySelector(`.alternativa[data-q="${i}"][data-k="${g.correta}"]`); if (bt) bt.classList.add('certa');
          fb.textContent = (resp[i] === g.correta ? (gent ? '✓ Muito bem! ' : '✓ Certo! ') : (gent ? 'Quase! A resposta certa é a ' : '✗ A correta é a ') + 'ABCD'[g.correta] + (resp[i] === g.correta ? '. ' : '. ')) + (g.explicacao || '');
        } else if (q.tipo === 'assoc') {
          const ok = g.correta.filter((v, j) => Array.isArray(resp[i]) && resp[i][j] === v).length;
          fb.textContent = (ok === g.correta.length ? '✓ Muito bem! ' : (gent ? 'Você acertou ' + ok + ' de ' + g.correta.length + '. Veja o certo: ' : 'Acertos: ' + ok + ' de ' + g.correta.length + '. Certo: ')) + (ok === g.correta.length ? '' : q.linhas.map((l, j) => l.replace(/___/g, '…') + ' → ' + q.banco[g.correta[j]]).join(' · ') + '. ') + (g.explicacao || '');
        } else if (q.tipo === 'ordem') {
          const ok = Array.isArray(resp[i]) && g.correta.every((v, j) => resp[i][j] === v);
          fb.textContent = (ok ? '✓ Muito bem! ' : (gent ? 'Quase! A ordem certa é: ' : 'A ordem certa é: ') + g.correta.map((v, j) => (j + 1) + 'º ' + q.passos[v]).join(' · ') + '. ') + (g.explicacao || '');
        }
      });
      document.querySelectorAll('.alternativa, textarea, select, .carta, [data-dit], [data-desfaz], [data-zera]').forEach(x => x.disabled = true);
      mostrar(cur, false);
      const nome1 = fN.value.split(' ')[0];
      msg(gent ? `Parabéns, ${nome1}! Você terminou a atividade e suas respostas foram registradas. Você acertou ${r.acertos} de ${r.total} questões de marcar, ligar ou ordenar. 🎉`
        : `Pronto, ${nome1}! Suas respostas foram registradas. Objetivas: ${r.acertos} de ${r.total} corretas.` + (r.notaFinal !== '' && r.notaFinal != null ? ` Nota: ${String(r.notaFinal).replace('.', ',')}.` : ' A correção das dissertativas ficou pendente.'), true);
    }).catch(err => { b.disabled = false; b.textContent = 'Enviar respostas'; msg('Não foi possível enviar: ' + falha(err) + '. Tente de novo.', false); });
  };
})();
</script>
</body>
</html>
