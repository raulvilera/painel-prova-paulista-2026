<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Atividade personalizada · Ensino Médio</title>
<style>
  :root { --bg:#f5f7f9; --card:#ffffff; --txt:#1d2a33; --muted:#5b6b75; --acc:#145a32; --borda:#d6dde3; --ok:#c9ddf7; --erro:#f6c6c6; --relevo:#a9b6bf; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#101820; --card:#1a2630; --txt:#e8eef2; --muted:#9fb0bb; --acc:#4fb37a; --borda:#2c3d49; --ok:#1d3c63; --erro:#5a2424; --relevo:#0a1117; }
  }
  :root[data-theme="dark"] { --bg:#101820; --card:#1a2630; --txt:#e8eef2; --muted:#9fb0bb; --acc:#4fb37a; --borda:#2c3d49; --ok:#1d3c63; --erro:#5a2424; --relevo:#0a1117; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; line-height:1.45; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px 24px; }
  h1 { font-size: 1.35rem; margin: 8px 0 4px; color: var(--acc); }
  p.sub { margin: 0 0 16px; color: var(--muted); }
  .card { background: var(--card); border:1px solid var(--borda); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  button { width:100%; font: inherit; padding: 10px 12px; border-radius: 8px; border:none; background: var(--acc); color:#fff; font-weight:700; cursor:pointer; margin-top: 12px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .q { border-top:1px solid var(--borda); padding: 14px 0 6px; }
  .q:first-child { border-top:none; padding-top: 0; }
  .q h3 { font-size: 1rem; margin: 0 0 8px; }
  .enun { white-space: pre-line; margin: 0 0 10px; }
  /* alternativas em alto relevo; a marcada "afunda" e fica verde-escura com letras brancas em negrito */
  .alt { position: relative; display:flex; gap:10px; align-items:flex-start; padding: 11px 14px; margin: 0 0 10px; border-radius: 10px; cursor:pointer;
    background: linear-gradient(180deg, var(--card), var(--bg)); border: 1px solid var(--borda);
    box-shadow: 0 4px 0 var(--relevo), 0 6px 10px rgba(0,0,0,.18); transform: translateY(0);
    transition: transform .08s ease, box-shadow .08s ease, background .12s ease, color .12s ease; user-select: none; }
  .alt:hover { filter: brightness(1.04); }
  .alt:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--relevo), 0 3px 6px rgba(0,0,0,.18); }
  .alt input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .alt:has(input:focus-visible) { outline: 3px solid #f2c94c; outline-offset: 2px; }
  .alt:has(input:checked), .alt.marcada { background: #0f4a2a; border-color: #0a3520; color: #fff; font-weight: 700;
    transform: translateY(4px); box-shadow: inset 0 3px 6px rgba(0,0,0,.45), 0 0 0 var(--borda); }
  .msg { padding: 12px; border-radius: 8px; margin-top: 12px; }
  .msg.erro { background: var(--erro); }
  .msg.ok { background: var(--ok); }
  .msg:not(.erro):not(.ok) { border: 1px solid var(--borda); }
  .res { font-size: 1.1rem; font-weight: 700; }
  .hidden { display:none; }
  label.campo { display:block; font-weight:600; margin: 8px 0 4px; }
  select { width:100%; font: inherit; padding: 9px 10px; border-radius: 8px; border:1px solid var(--borda); background: var(--card); color: var(--txt); }
  .base { background: var(--bg); border:1px solid var(--borda); border-left: 4px solid var(--acc); border-radius: 10px; padding: 12px; margin: 0 0 12px; }
  .base .rot { font-size: .78rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--acc); margin: 0 0 8px; }
  .base figure { margin: 0 0 10px; }
  .base figure img { display:block; width:100%; max-height: 420px; object-fit: contain; background: #fff; border-radius: 8px; }
  .base figure.carregando img { min-height: 160px; background: linear-gradient(90deg, var(--card), var(--borda), var(--card)); background-size: 200% 100%; animation: brilho 1.4s infinite; }
  @keyframes brilho { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  .base figcaption { font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .base figcaption small { display:block; font-size: .72rem; margin-top: 2px; }
  .base figcaption a { color: inherit; }
  .base .txt { margin: 0; font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>Atividade personalizada</h1>
  <p class="sub">Escolha a sua turma e o seu nome. A atividade tem 10 questões, feitas a partir das suas dificuldades.</p>

  <section class="card">
    <label class="campo" for="selTurma">Turma</label>
    <select id="selTurma"><option value="">Carregando…</option></select>
    <label class="campo" for="selNome">Seu nome</label>
    <select id="selNome" disabled><option value="">Escolha a turma primeiro</option></select>
    <button id="abrir" type="button" disabled>Abrir minha atividade</button>
    <div id="aviso" class="msg erro hidden" role="alert"></div>
  </section>

  <section id="atividade" class="card hidden">
    <div id="cabec"></div>
    <form id="form"></form>
    <button id="enviar" type="button">Enviar respostas</button>
    <div id="resultado" class="msg ok hidden" role="status"></div>
  </section>
</main>

<script>
(function () {
  'use strict';
  var API = '/api/personalizada-em';
  var N = 10;
  var atual = null;   // { turma, nome, questoes }

  var $ = function (id) { return document.getElementById(id); };
  var selTurma = $('selTurma'), selNome = $('selNome'), abrirEl = $('abrir'), avisoEl = $('aviso');
  var atividadeEl = $('atividade'), cabecEl = $('cabec'), formEl = $('form'), enviarEl = $('enviar'), resEl = $('resultado');

  function mostrarAviso(texto) { avisoEl.textContent = texto; avisoEl.classList.remove('hidden'); }
  function esconderAviso() { avisoEl.classList.add('hidden'); avisoEl.textContent = ''; }

  function pedir(url, opcoes) {
    opcoes = opcoes || {};
    opcoes.credentials = 'same-origin';
    return fetch(url, opcoes).then(function (r) {
      return r.json().catch(function () { return { ok: false, erro: 'Resposta inesperada do servidor.' }; })
        .then(function (d) { return { status: r.status, dados: d }; });
    });
  }

  // 1) Sem login: o aluno escolhe a turma e o nome na lista
  var LISTA = {};
  function opcao(v, t) { var o = document.createElement('option'); o.value = v; o.textContent = t; return o; }
  pedir(API + '?lista=1').then(function (r) {
    if (!r.dados.ok) { selTurma.innerHTML = ''; selTurma.appendChild(opcao('', 'Indisponível')); mostrarAviso(r.dados.erro || 'Não foi possível carregar as turmas.'); return; }
    LISTA = r.dados.nomes || {};
    selTurma.innerHTML = ''; selTurma.appendChild(opcao('', 'Selecione'));
    (r.dados.turmas || []).forEach(function (t) { selTurma.appendChild(opcao(t, t)); });
  }).catch(function () { mostrarAviso('Falha de conexão. Recarregue a página para tentar de novo.'); });

  selTurma.addEventListener('change', function () {
    selNome.innerHTML = ''; atividadeEl.classList.add('hidden'); atual = null; esconderAviso();
    var nomes = LISTA[selTurma.value] || [];
    if (!selTurma.value) { selNome.appendChild(opcao('', 'Escolha a turma primeiro')); selNome.disabled = true; abrirEl.disabled = true; return; }
    selNome.appendChild(opcao('', 'Selecione o seu nome'));
    nomes.forEach(function (n) { selNome.appendChild(opcao(n, n)); });
    selNome.disabled = false; abrirEl.disabled = true;
  });
  // ao escolher o nome, a atividade inteira já carrega (questões, textos-base e imagens)
  selNome.addEventListener('change', function () { atividadeEl.classList.add('hidden'); atual = null; abrirEl.disabled = !selNome.value; if (selNome.value) abrir(); });
  abrirEl.addEventListener('click', abrir);
  abrirEl.style.display = 'none';

  // 2) Abre a atividade do aluno escolhido
  function abrir() {
    if (!selTurma.value || !selNome.value) return;
    esconderAviso(); resEl.classList.add('hidden');
    abrirEl.disabled = true; abrirEl.textContent = 'Abrindo…';
    var pedido = selTurma.value + '|' + selNome.value; abrir.ultimo = pedido;
    mostrarCarregando('Carregando a sua atividade…');
    pedir(API + '?' + new URLSearchParams({ turma: selTurma.value, nome: selNome.value })).then(function (r) {
      if (abrir.ultimo !== pedido) return;   // o aluno trocou de nome no meio do carregamento
      abrirEl.disabled = false; abrirEl.textContent = 'Abrir minha atividade';
      if (!r.dados.ok) { esconderCarregando(); abrirEl.style.display = ''; mostrarAviso(r.dados.erro || 'Não foi possível abrir a atividade.'); return; }
      atual = { turma: r.dados.turma, nome: r.dados.nome, questoes: r.dados.questoes };
      montar(r.dados);
    }).catch(function () { esconderCarregando(); abrirEl.disabled = false; abrirEl.textContent = 'Tentar de novo'; abrirEl.style.display = ''; mostrarAviso('Falha de conexão. Tente de novo.'); });
  }

  function montar(d) {
    cabecEl.innerHTML = '';
    var h = document.createElement('h2'); h.style.fontSize = '1.1rem'; h.style.margin = '0 0 4px'; h.textContent = d.nome;
    var p = document.createElement('p'); p.className = 'sub'; p.style.margin = '0 0 12px';
    p.textContent = d.componente + ' · ' + d.turma;
    cabecEl.appendChild(h); cabecEl.appendChild(p);

    formEl.innerHTML = '';
    var imagens = [];
    d.questoes.forEach(function (q, i) {
      var box = document.createElement('div'); box.className = 'q';
      var t = document.createElement('h3'); t.textContent = 'Questão ' + (i + 1);
      var e = document.createElement('p'); e.className = 'enun'; e.textContent = q.enunciado;
      box.appendChild(t);
      if (q.ctx && q.ctx.texto) { var tb = textoBase(q.ctx); box.appendChild(tb.el); imagens.push(tb.pronto); }
      box.appendChild(e);
      q.alts.forEach(function (txt, k) {
        var lab = document.createElement('label'); lab.className = 'alt';
        var inp = document.createElement('input'); inp.type = 'radio'; inp.name = 'q' + i; inp.value = String(k);
        var span = document.createElement('span'); span.textContent = 'ABCDE'.charAt(k) + ') ' + txt;
        inp.addEventListener('change', function () { box.querySelectorAll('.alt').forEach(function (l) { l.classList.toggle('marcada', l.querySelector('input').checked); }); });
        lab.appendChild(inp); lab.appendChild(span); box.appendChild(lab);
      });
      formEl.appendChild(box);
    });
    // mostra a atividade quando todas as imagens chegarem (ou depois de 12 s, para não travar em conexão lenta)
    var total = imagens.length, feitas = 0;
    imagens.forEach(function (p) { p.then(function () { feitas++; if (total) mostrarCarregando('Carregando a sua atividade… imagens ' + feitas + ' de ' + total); }); });
    var mostrou = false, pedidoAtual = abrir.ultimo;
    function mostrar() {
      if (mostrou || abrir.ultimo !== pedidoAtual) return; mostrou = true;
      esconderCarregando();
      atividadeEl.classList.remove('hidden');
      enviarEl.disabled = false;
      resEl.classList.add('hidden');
      atividadeEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    Promise.all(imagens).then(mostrar); setTimeout(mostrar, 12000);
  }

  // Texto-base: contexto da situação + imagem buscada no Wikimedia Commons (pela API do painel, com cache)
  function textoBase(c) {
    var d = document.createElement('div'); d.className = 'base';
    var r = document.createElement('p'); r.className = 'rot'; r.textContent = 'Texto-base'; d.appendChild(r);
    var fig = document.createElement('figure'); fig.className = 'carregando';
    var img = document.createElement('img'); img.alt = c.legenda || 'Imagem relacionada à questão'; img.loading = 'eager'; img.decoding = 'async';
    var fim, pronto = new Promise(function (ok) { fim = ok; });
    var cap = document.createElement('figcaption');
    fig.appendChild(img); fig.appendChild(cap); d.appendChild(fig);
    var tx = document.createElement('p'); tx.className = 'txt';
    tx.textContent = c.texto;
    d.appendChild(tx);
    fetch(API + '?v=3&img=' + encodeURIComponent(c.img)).then(function (r) { return r.json(); }).then(function (j) {
      var im = j && j.ok && j.imagem;
      if (!im) { fig.remove(); fim(); return; }
      img.onload = function () { fig.classList.remove('carregando'); fim(); };
      img.onerror = function () { fig.remove(); fim(); };
      img.src = im.src;
      cap.textContent = c.legenda || '';
      var cr = document.createElement('small'), a = document.createElement('a');
      a.href = im.pagina; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Wikimedia Commons';
      cr.appendChild(document.createTextNode('Imagem: ' + (im.autor ? im.autor + ' · ' : '') + (im.licenca ? im.licenca + ' · ' : '')));
      cr.appendChild(a); cap.appendChild(cr);
    }).catch(function () { fig.remove(); fim(); });
    return { el: d, pronto: pronto };
  }

  // aviso de carregamento (usa a mesma caixa de mensagens da página)
  var carregEl = document.createElement('div'); carregEl.className = 'msg hidden'; carregEl.setAttribute('role', 'status');
  abrirEl.parentNode.insertBefore(carregEl, abrirEl.nextSibling);
  function mostrarCarregando(t) { carregEl.textContent = t; carregEl.classList.remove('hidden'); }
  function esconderCarregando() { carregEl.classList.add('hidden'); }

  // 3) Envia as respostas (uma vez só)
  enviarEl.addEventListener('click', function () {
    if (!atual) return;
    var respostas = [], faltando = 0;
    for (var i = 0; i < N; i++) {
      var sel = formEl.querySelector('input[name="q' + i + '"]:checked');
      if (!sel) faltando++;
      respostas.push(sel ? Number(sel.value) : null);
    }
    if (faltando) { mostrarAviso('Faltam ' + faltando + ' resposta(s). Responda todas antes de enviar.'); return; }
    esconderAviso();
    enviarEl.disabled = true; enviarEl.textContent = 'Enviando…';
    pedir(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ turma: atual.turma, nome: atual.nome, respostas: respostas })
    }).then(function (r) {
        var d = r.dados;
        enviarEl.textContent = 'Enviar respostas';
        if (!d.ok) { enviarEl.disabled = false; mostrarAviso(d.erro || 'Não foi possível enviar.'); return; }
        formEl.querySelectorAll('input').forEach(function (x) { x.disabled = true; });
        resEl.textContent = 'Você acertou ' + d.acertos + ' de ' + d.total + ' questões. Respostas enviadas.';
        resEl.classList.remove('hidden');
        enviarEl.disabled = true;
      })
      .catch(function () {
        enviarEl.textContent = 'Enviar respostas'; enviarEl.disabled = false;
        mostrarAviso('Falha de conexão ao enviar. Tente de novo.');
      });
  });
})();
</script>
<script src="/voltar-painel.js" defer></script>
</body>
</html>
