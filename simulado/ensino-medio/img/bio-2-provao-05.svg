<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="Segoe UI,Arial,sans-serif">
<title>Eletroforese de amplicons (PCR)</title>
<desc>Gel de eletroforese com cinco canaletas: amostra da cena, suspeitos 1, 2 e 3 e controle negativo, e bandas de 120, 180 e 250 pb.</desc>
<rect width="760" height="340" fill="#eef6f1"/>
<rect x="10" y="8" width="740" height="50" rx="12" fill="#1f6f4a"/><text x="28" y="31" font-size="19" font-weight="700" fill="#fff">Eletroforese de amplicons (PCR)</text><text x="28" y="49" font-size="12.5" fill="#d8efe2">Três loci · tamanhos em pares de bases (pb)</text>
<rect x="110" y="78" width="630" height="238" rx="12" fill="#2b3a42" stroke="none" stroke-width="1"/>
<rect x="150" y="90" width="68" height="10" rx="2" fill="#10171b" stroke="none" stroke-width="1"/>
<rect x="150" y="240" width="68" height="9" rx="3" fill="#9fe8ff" stroke="none" stroke-width="1" opacity="0.95"/>
<rect x="150" y="190" width="68" height="9" rx="3" fill="#9fe8ff" stroke="none" stroke-width="1" opacity="0.95"/>
<rect x="150" y="140" width="68" height="9" rx="3" fill="#9fe8ff" stroke="none" stroke-width="1" opacity="0.95"/>
