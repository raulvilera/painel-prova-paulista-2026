<rect x="268" y="240" width="68" height="9" rx="3" fill="#9fe8ff" stroke="none" stroke-width="1" opacity="0.95"/>
<rect x="268" y="190" width="68" height="9" rx="3" fill="#9fe8ff" stroke="none" stroke-width="1" opacity="0.95"/>
<text x="302" y="308" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Suspeito 1</text>
<rect x="386" y="90" width="68" height="10" rx="2" fill="#10171b" stroke="none" stroke-width="1"/>
<rect x="386" y="240" width="68" height="9" rx="3" fill="#9fe8ff" stroke="none" stroke-width="1" opacity="0.95"/>
<rect x="386" y="190" width="68" height="9" rx="3" fill="#9fe8ff" stroke="none" stroke-width="1" opacity="0.95"/>
<rect x="386" y="140" width="68" height="9" rx="3" fill="#9fe8ff" stroke="none" stroke-width="1" opacity="0.95"/>
<text x="420" y="308" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Suspeito 2</text>
<rect x="504" y="90" width="68" height="10" rx="2" fill="#10171b" stroke="none" stroke-width="1"/>
<rect x="504" y="190" width="68" height="9" rx="3" fill="#9fe8ff" stroke="none" stroke-width="1" opacity="0.95"/>
<rect x="504" y="140" width="68" height="9" rx="3" fill="#9fe8ff" stroke="none" stroke-width="1" opacity="0.95"/>
<text x="538" y="308" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Suspeito 3</text>
<rect x="622" y="90" width="68" height="10" rx="2" fill="#10171b" stroke="none" stroke-width="1"/>
<text x="656" y="308" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Controle (−)</text>
