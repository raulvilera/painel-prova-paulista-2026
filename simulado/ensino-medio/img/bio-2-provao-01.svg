<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="Segoe UI,Arial,sans-serif">
<title>Produtividade em três lagos</title>
<desc>Barras de produtividade de produtores e de consumidores primários nos lagos A, B e C, com a proteção da margem de cada um.</desc>
<rect width="760" height="340" fill="#eef6f1"/>
<rect x="10" y="8" width="740" height="50" rx="12" fill="#1f6f4a"/><text x="28" y="31" font-size="19" font-weight="700" fill="#fff">Produtividade em três lagos</text><text x="28" y="49" font-size="12.5" fill="#d8efe2">kg C ha⁻¹ ano⁻¹ · valores ilustrativos</text>
<rect x="14" y="70" width="235" height="250" rx="12" fill="#ffffff" stroke="#b9d3c3" stroke-width="2"/>
<text x="28" y="92" font-size="13" font-weight="700" fill="#5d7a69" text-anchor="start">Lago A</text>
<path d="M30 110 q30 -10 60 0 t60 0 t60 0" fill="none" stroke="#3b82c4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="90" y="180" font-size="12" font-weight="400" fill="#25402f" text-anchor="end">Produtores</text>
<rect x="98" y="155" width="56.25" height="40" rx="4" fill="#2e8b57" stroke="none" stroke-width="1"/>
<text x="160.25" y="180" font-size="12" font-weight="700" fill="#25402f" text-anchor="start">1 200</text>
<text x="90" y="232" font-size="12" font-weight="400" fill="#25402f" text-anchor="end">Consum.</text>
<rect x="98" y="207" width="8.4375" height="40" rx="4" fill="#e07b39" stroke="none" stroke-width="1"/>
<text x="112.4375" y="232" font-size="12" font-weight="700" fill="#25402f" text-anchor="start">180</text>
<text x="131" y="294" font-size="12.5" font-weight="700" fill="#5d7a69" text-anchor="middle">margem: proteção total</text>
<rect x="261" y="70" width="235" height="250" rx="12" fill="#ffffff" stroke="#b9d3c3" stroke-width="2"/>
<text x="275" y="92" font-size="13" font-weight="700" fill="#5d7a69" text-anchor="start">Lago B</text>
<path d="M277 110 q30 -10 60 0 t60 0 t60 0" fill="none" stroke="#3b82c4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="337" y="180" font-size="12" font-weight="400" fill="#25402f" text-anchor="end">Produtores</text>
<rect x="345" y="155" width="42.1875" height="40" rx="4" fill="#2e8b57" stroke="none" stroke-width="1"/>
<text x="393.1875" y="180" font-size="12" font-weight="700" fill="#25402f" text-anchor="start">900</text>
<text x="337" y="232" font-size="12" font-weight="400" fill="#25402f" text-anchor="end">Consum.</text>
<rect x="345" y="207" width="4.21875" height="40" rx="4" fill="#e07b39" stroke="none" stroke-width="1"/>
<text x="355.21875" y="232" font-size="12" font-weight="700" fill="#25402f" text-anchor="start">90</text>
<text x="378" y="294" font-size="12.5" font-weight="700" fill="#5d7a69" text-anchor="middle">margem: sem proteção</text>
<rect x="508" y="70" width="235" height="250" rx="12" fill="#ffffff" stroke="#b9d3c3" stroke-width="2"/>
<text x="522" y="92" font-size="13" font-weight="700" fill="#5d7a69" text-anchor="start">Lago C</text>
<path d="M524 110 q30 -10 60 0 t60 0 t60 0" fill="none" stroke="#3b82c4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="584" y="180" font-size="12" font-weight="400" fill="#25402f" text-anchor="end">Produtores</text>
<rect x="592" y="155" width="70.3125" height="40" rx="4" fill="#2e8b57" stroke="none" stroke-width="1"/>
<text x="668.3125" y="180" font-size="12" font-weight="700" fill="#25402f" text-anchor="start">1 500</text>
<text x="584" y="232" font-size="12" font-weight="400" fill="#25402f" text-anchor="end">Consum.</text>
<rect x="592" y="207" width="9.84375" height="40" rx="4" fill="#e07b39" stroke="none" stroke-width="1"/>
<text x="607.84375" y="232" font-size="12" font-weight="700" fill="#25402f" text-anchor="start">210</text>
<text x="625" y="294" font-size="12.5" font-weight="700" fill="#5d7a69" text-anchor="middle">margem: proteção parcial</text>
</svg>
