<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="Segoe UI,Arial,sans-serif">
<title>Combustíveis: CO₂ produzido e energia liberada</title>
<desc>Cartões do etanol e do metano com o número de mols de CO2 produzidos e a energia liberada por mol de combustível.</desc>
<rect width="760" height="340" fill="#eef4fa"/>
<rect x="10" y="8" width="740" height="50" rx="12" fill="#2c5f8a"/><text x="28" y="31" font-size="19" font-weight="700" fill="#fff">Combustíveis: CO₂ produzido e energia liberada</text><text x="28" y="49" font-size="12.5" fill="#d6e6f4">Combustões completas · valores ilustrativos · M(CO₂) = 44 g mol⁻¹</text>
<rect x="14" y="70" width="360" height="250" rx="12" fill="#ffffff" stroke="#b4cadf" stroke-width="2"/>
<text x="28" y="92" font-size="13" font-weight="700" fill="#5a7186" text-anchor="start">Etanol (C₂H₅OH)</text>
<path d="M64 190 q-14 -24 0 -44 q14 24 0 44z" fill="#e07b39" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
<path d="M86 190 q-14 -24 0 -44 q14 24 0 44z" fill="#e07b39" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>
<path d="M108 190 q-14 -24 0 -44 q14 24 0 44z" fill="#e07b39" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/>
<text x="164" y="128" font-size="12" font-weight="400" fill="#5a7186" text-anchor="start">CO₂ produzido por mol</text>
<text x="164" y="156" font-size="26" font-weight="700" fill="#1f3347" text-anchor="start">2 mol</text>
<text x="164" y="200" font-size="12" font-weight="400" fill="#5a7186" text-anchor="start">Energia liberada por mol</text>
<text x="164" y="228" font-size="26" font-weight="700" fill="#e07b39" text-anchor="start">1367 kJ</text>
<text x="44" y="284" font-size="12" font-weight="400" fill="#5a7186" text-anchor="start">combustão completa do combustível</text>
<rect x="386" y="70" width="360" height="250" rx="12" fill="#ffffff" stroke="#b4cadf" stroke-width="2"/>
<text x="400" y="92" font-size="13" font-weight="700" fill="#5a7186" text-anchor="start">Metano (CH₄)</text>
<path d="M436 190 q-14 -24 0 -44 q14 24 0 44z" fill="#3b82c4" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
<path d="M458 190 q-14 -24 0 -44 q14 24 0 44z" fill="#3b82c4" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.7"/>
<path d="M480 190 q-14 -24 0 -44 q14 24 0 44z" fill="#3b82c4" stroke="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.55"/>
<text x="536" y="128" font-size="12" font-weight="400" fill="#5a7186" text-anchor="start">CO₂ produzido por mol</text>
<text x="536" y="156" font-size="26" font-weight="700" fill="#1f3347" text-anchor="start">1 mol</text>
<text x="536" y="200" font-size="12" font-weight="400" fill="#5a7186" text-anchor="start">Energia liberada por mol</text>
<text x="536" y="228" font-size="26" font-weight="700" fill="#3b82c4" text-anchor="start">890 kJ</text>
<text x="416" y="284" font-size="12" font-weight="400" fill="#5a7186" text-anchor="start">combustão completa do combustível</text>
</svg>
