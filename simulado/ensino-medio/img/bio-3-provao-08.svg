<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="Segoe UI,Arial,sans-serif">
<title>Do repouso ao exercício intenso</title>
<desc>Barras de frequência cardíaca e ventilação pulmonar em repouso e durante exercício intenso.</desc>
<rect width="760" height="340" fill="#eef6f1"/>
<rect x="10" y="8" width="740" height="50" rx="12" fill="#1f6f4a"/><text x="28" y="31" font-size="19" font-weight="700" fill="#fff">Do repouso ao exercício intenso</text><text x="28" y="49" font-size="12.5" fill="#d8efe2">Pessoa saudável · valores ilustrativos</text>
<rect x="14" y="70" width="360" height="250" rx="12" fill="#ffffff" stroke="#b9d3c3" stroke-width="2"/>
<text x="28" y="92" font-size="13" font-weight="700" fill="#5d7a69" text-anchor="start">Frequência cardíaca (bpm)</text>
<line x1="50" y1="262" x2="360" y2="262" stroke="#5d7a69" stroke-width="1.5" stroke-linecap="round"/>
<line x1="50" y1="262" x2="360" y2="262" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="266" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">0</text>
<line x1="50" y1="224.5" x2="360" y2="224.5" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="228.5" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">40</text>
<line x1="50" y1="187" x2="360" y2="187" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="191" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">80</text>
<line x1="50" y1="149.5" x2="360" y2="149.5" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="153.5" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">120</text>
<line x1="50" y1="112" x2="360" y2="112" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="116" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">160</text>
<rect x="106.5" y="196.375" width="42" height="65.625" rx="3" fill="#3b82c4" stroke="none" stroke-width="1"/>
<text x="127.5" y="191.375" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">70</text>
<text x="127.5" y="279" font-size="12" font-weight="400" fill="#25402f" text-anchor="middle">Repouso</text>
<rect x="261.5" y="121.375" width="42" height="140.625" rx="3" fill="#c0392b" stroke="none" stroke-width="1"/>
<text x="282.5" y="116.375" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">150</text>
<text x="282.5" y="279" font-size="12" font-weight="400" fill="#25402f" text-anchor="middle">Exercício</text>
<rect x="386" y="70" width="360" height="250" rx="12" fill="#ffffff" stroke="#b9d3c3" stroke-width="2"/>
<text x="400" y="92" font-size="13" font-weight="700" fill="#5d7a69" text-anchor="start">Ventilação pulmonar (L/min)</text>
<line x1="422" y1="262" x2="732" y2="262" stroke="#5d7a69" stroke-width="1.5" stroke-linecap="round"/>
<line x1="422" y1="262" x2="732" y2="262" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="416" y="266" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">0</text>
<line x1="422" y1="232" x2="732" y2="232" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="416" y="236" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">20</text>
<line x1="422" y1="202" x2="732" y2="202" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="416" y="206" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">40</text>
<line x1="422" y1="172" x2="732" y2="172" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="416" y="176" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">60</text>
<line x1="422" y1="142" x2="732" y2="142" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="416" y="146" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">80</text>
<line x1="422" y1="112" x2="732" y2="112" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="416" y="116" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">100</text>
<rect x="478.5" y="253" width="42" height="9" rx="3" fill="#3b82c4" stroke="none" stroke-width="1"/>
<text x="499.5" y="248" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">6</text>
<text x="499.5" y="279" font-size="12" font-weight="400" fill="#25402f" text-anchor="middle">Repouso</text>
<rect x="633.5" y="127" width="42" height="135" rx="3" fill="#c0392b" stroke="none" stroke-width="1"/>
<text x="654.5" y="122" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">90</text>
<text x="654.5" y="279" font-size="12" font-weight="400" fill="#25402f" text-anchor="middle">Exercício</text>
</svg>
