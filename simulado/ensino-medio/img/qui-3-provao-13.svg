<text x="589.5" y="279" font-size="11.5" font-weight="400" fill="#1f3347" text-anchor="middle">Captação</text>
<rect x="663.5" y="136" width="42" height="126" rx="3" fill="#c0392b" stroke="none" stroke-width="1"/>
