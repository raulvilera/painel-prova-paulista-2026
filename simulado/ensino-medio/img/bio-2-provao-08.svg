<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="Segoe UI,Arial,sans-serif">
<title>Dois relatos hipotéticos</title>
<desc>Esquema do caso I com efeito decrescente após exposições repetidas e do caso II com resposta imune mais rápida e intensa na segunda exposição.</desc>
<rect width="760" height="340" fill="#eef6f1"/>
<rect x="10" y="8" width="740" height="50" rx="12" fill="#1f6f4a"/><text x="28" y="31" font-size="19" font-weight="700" fill="#fff">Dois relatos hipotéticos</text><text x="28" y="49" font-size="12.5" fill="#d8efe2">Caso I: neuroadaptação · Caso II: resposta a antígenos (esquemas qualitativos)</text>
<rect x="14" y="70" width="360" height="250" rx="12" fill="#ffffff" stroke="#b9d3c3" stroke-width="2"/>
<text x="28" y="92" font-size="13" font-weight="700" fill="#5d7a69" text-anchor="start">Caso I — exposições repetidas a uma substância</text>
<line x1="60" y1="242" x2="360" y2="242" stroke="#5d7a69" stroke-width="1.5" stroke-linecap="round"/>
<line x1="60" y1="NaN" x2="360" y2="NaN" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="54" y="NaN" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">NaN</text>
<rect x="76.5" y="112" width="42" height="130" rx="3" fill="#8e5bb5" stroke="none" stroke-width="1"/>
<text x="97.5" y="107" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">10</text>
<text x="97.5" y="259" font-size="11" font-weight="400" fill="#25402f" text-anchor="middle">1ª exposição</text>
<rect x="151.5" y="138" width="42" height="104" rx="3" fill="#8e5bb5" stroke="none" stroke-width="1"/>
<text x="172.5" y="133" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">8</text>
<text x="172.5" y="259" font-size="11" font-weight="400" fill="#25402f" text-anchor="middle">2ª exposição</text>
<rect x="226.5" y="164" width="42" height="78" rx="3" fill="#8e5bb5" stroke="none" stroke-width="1"/>
<text x="247.5" y="159" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">6</text>
<text x="247.5" y="259" font-size="11" font-weight="400" fill="#25402f" text-anchor="middle">3ª exposição</text>
<rect x="301.5" y="190" width="42" height="52" rx="3" fill="#8e5bb5" stroke="none" stroke-width="1"/>
<text x="322.5" y="185" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">4</text>
<text x="322.5" y="259" font-size="11" font-weight="400" fill="#25402f" text-anchor="middle">4ª exposição</text>
<text x="194" y="290" font-size="11.5" font-weight="400" fill="#5d7a69" text-anchor="middle">efeito (esquema)</text>
<text x="194" y="308" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">dose buscada ↑</text>
<rect x="386" y="70" width="360" height="250" rx="12" fill="#ffffff" stroke="#b9d3c3" stroke-width="2"/>
<text x="400" y="92" font-size="13" font-weight="700" fill="#5d7a69" text-anchor="start">Caso II — preparação com antígenos</text>
<path d="M420 280 L470 280 C490 280 500 260 520 220 S545 280 580 280 L620 280 C640 280 650 200 676 150 S710 280 726 280" fill="none" stroke="#3b82c4" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="420" y1="280" x2="730" y2="280" stroke="#5d7a69" stroke-width="1.5" stroke-linecap="round"/>
<text x="520" y="208" font-size="12" font-weight="400" fill="#25402f" text-anchor="middle">1ª dose</text>
<text x="640" y="138" font-size="12" font-weight="400" fill="#25402f" text-anchor="middle">2ª dose: resposta maior</text>
<text x="576" y="304" font-size="11.5" font-weight="400" fill="#5d7a69" text-anchor="middle">tempo →</text>
</svg>
