<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="Segoe UI,Arial,sans-serif">
<title>Sequência de decaimento do urânio-238</title>
<desc>Esquema com núcleo de urânio-238, seta de emissão alfa, núcleo intermediário desconhecido, seta de emissão beta e núcleo final desconhecido.</desc>
<rect width="760" height="340" fill="#eef4fa"/>
<rect x="10" y="8" width="740" height="50" rx="12" fill="#2c5f8a"/><text x="28" y="31" font-size="19" font-weight="700" fill="#fff">Sequência de decaimento do urânio-238</text><text x="28" y="49" font-size="12.5" fill="#d6e6f4">Uma emissão alfa seguida de uma emissão beta menos (β⁻)</text>
<circle cx="110" cy="190" r="52" fill="#d6e6f4" stroke="#3b82c4" stroke-width="4"/>
<text x="74" y="168" font-size="15" font-weight="700" fill="#1f3347" text-anchor="middle">238</text>
<text x="74" y="192" font-size="15" font-weight="700" fill="#1f3347" text-anchor="middle">92</text>
<text x="116" y="202" font-size="28" font-weight="700" fill="#1f3347" text-anchor="middle">U</text>
<circle cx="380" cy="190" r="52" fill="#fff" stroke="#3b82c4" stroke-width="4"/>
<text x="344" y="168" font-size="15" font-weight="700" fill="#1f3347" text-anchor="middle">?</text>
<text x="344" y="192" font-size="15" font-weight="700" fill="#1f3347" text-anchor="middle">?</text>
<text x="386" y="202" font-size="28" font-weight="700" fill="#5a7186" text-anchor="middle">?</text>
<circle cx="650" cy="190" r="52" fill="#fff" stroke="#3b82c4" stroke-width="4"/>
<text x="614" y="168" font-size="15" font-weight="700" fill="#1f3347" text-anchor="middle">?</text>
<text x="614" y="192" font-size="15" font-weight="700" fill="#1f3347" text-anchor="middle">?</text>
<text x="656" y="202" font-size="28" font-weight="700" fill="#5a7186" text-anchor="middle">?</text>
<line x1="172" y1="190" x2="318" y2="190" stroke="#e07b39" stroke-width="2.5" stroke-linecap="round"/>
<path d="M318 190 L308.9955289764732 194.3496553411123 L308.9955289764732 185.6503446588877 Z" fill="#e07b39"/>
<text x="245" y="172" font-size="13" font-weight="700" fill="#e07b39" text-anchor="middle">emissão α</text>
<text x="245" y="214" font-size="12" font-weight="400" fill="#5a7186" text-anchor="middle">A − 4 · Z − 2</text>
<line x1="442" y1="190" x2="588" y2="190" stroke="#8e5bb5" stroke-width="2.5" stroke-linecap="round"/>
<path d="M588 190 L578.9955289764732 194.3496553411123 L578.9955289764732 185.6503446588877 Z" fill="#8e5bb5"/>
<text x="515" y="172" font-size="13" font-weight="700" fill="#8e5bb5" text-anchor="middle">emissão β⁻</text>
<text x="515" y="214" font-size="12" font-weight="400" fill="#5a7186" text-anchor="middle">A igual · Z + 1</text>
<text x="380" y="300" font-size="12" font-weight="400" fill="#5a7186" text-anchor="middle" font-style="italic">Número de massa (A) sobre o número atômico (Z)</text>
</svg>
