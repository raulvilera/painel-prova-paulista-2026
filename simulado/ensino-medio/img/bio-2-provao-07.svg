<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="Segoe UI,Arial,sans-serif">
<title>Heredograma: condição autossômica recessiva</title>
<desc>Casal não afetado com um filho afetado (aa) e uma gestação futura indicada por interrogação.</desc>
<rect width="760" height="340" fill="#eef6f1"/>
<rect x="10" y="8" width="740" height="50" rx="12" fill="#1f6f4a"/><text x="28" y="31" font-size="19" font-weight="700" fill="#fff">Heredograma: condição autossômica recessiva</text><text x="28" y="49" font-size="12.5" fill="#d8efe2">Genótipo aa = afetado · não há penetrância incompleta</text>
<rect x="240" y="100" width="50" height="50" rx="0" fill="#fff" stroke="#37474f" stroke-width="3"/>
<circle cx="520" cy="125" r="25" fill="#fff" stroke="#37474f" stroke-width="3"/>
<text x="265" y="92" font-size="12" font-weight="400" fill="#5d7a69" text-anchor="middle">Genitor 1</text>
<text x="520" y="92" font-size="12" font-weight="400" fill="#5d7a69" text-anchor="middle">Genitor 2</text>
<text x="265" y="170" font-size="12.5" font-weight="400" fill="#25402f" text-anchor="middle">não afetado</text>
<text x="520" y="170" font-size="12.5" font-weight="400" fill="#25402f" text-anchor="middle">não afetada</text>
<line x1="290" y1="125" x2="495" y2="125" stroke="#37474f" stroke-width="3" stroke-linecap="round"/>
<line x1="392" y1="125" x2="392" y2="215" stroke="#37474f" stroke-width="3" stroke-linecap="round"/>
<line x1="300" y1="215" x2="500" y2="215" stroke="#37474f" stroke-width="3" stroke-linecap="round"/>
<line x1="300" y1="215" x2="300" y2="235" stroke="#37474f" stroke-width="3" stroke-linecap="round"/>
<line x1="500" y1="215" x2="500" y2="235" stroke="#37474f" stroke-width="3" stroke-linecap="round"/>
<rect x="275" y="235" width="50" height="50" rx="0" fill="#37474f" stroke="#37474f" stroke-width="3"/>
<text x="300" y="306" font-size="13" font-weight="700" fill="#25402f" text-anchor="middle">filho afetado (aa)</text>
<circle cx="500" cy="260" r="25" fill="#fff" stroke="#2e8b57" stroke-width="3"/>
<text x="500" y="270" font-size="28" font-weight="700" fill="#2e8b57" text-anchor="middle">?</text>
<text x="500" y="306" font-size="13" font-weight="700" fill="#25402f" text-anchor="middle">próxima gestação</text>
<text x="620" y="270" font-size="12" font-weight="400" fill="#5d7a69" text-anchor="middle">▇ afetado   □ ○ não afetado</text>
</svg>
