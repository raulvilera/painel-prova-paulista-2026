<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="Segoe UI,Arial,sans-serif">
<title>Álcool, energético e tempo de reação</title>
<desc>Gráficos de tempo médio de reação e alerta percebido para controle, álcool e álcool com energético.</desc>
<rect width="760" height="340" fill="#eef6f1"/>
<rect x="10" y="8" width="740" height="50" rx="12" fill="#1f6f4a"/><text x="28" y="31" font-size="19" font-weight="700" fill="#fff">Álcool, energético e tempo de reação</text><text x="28" y="49" font-size="12.5" fill="#d8efe2">Grupos equivalentes · valores ilustrativos</text>
<rect x="14" y="70" width="360" height="230" rx="12" fill="#ffffff" stroke="#b9d3c3" stroke-width="2"/>
<text x="28" y="92" font-size="13" font-weight="700" fill="#5d7a69" text-anchor="start">Tempo médio de reação (ms) — maior = mais lento</text>
<line x1="50" y1="260" x2="360" y2="260" stroke="#5d7a69" stroke-width="1.5" stroke-linecap="round"/>
<line x1="50" y1="260" x2="360" y2="260" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="264" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">0</text>
<line x1="50" y1="210" x2="360" y2="210" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="214" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">200</text>
<line x1="50" y1="160" x2="360" y2="160" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="164" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">400</text>
<line x1="50" y1="110" x2="360" y2="110" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="44" y="114" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">600</text>
<rect x="80.66666666666666" y="175" width="42" height="85" rx="3" fill="#9aa5ab" stroke="none" stroke-width="1"/>
<text x="101.66666666666666" y="170" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">340</text>
<text x="101.66666666666666" y="277" font-size="12" font-weight="400" fill="#25402f" text-anchor="middle">Controle</text>
<rect x="183.99999999999997" y="132.5" width="42" height="127.5" rx="3" fill="#c0392b" stroke="none" stroke-width="1"/>
<text x="204.99999999999997" y="127.5" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">510</text>
<text x="204.99999999999997" y="277" font-size="12" font-weight="400" fill="#25402f" text-anchor="middle">Álcool</text>
<rect x="287.3333333333333" y="167.5" width="42" height="92.5" rx="3" fill="#e07b39" stroke="none" stroke-width="1"/>
<text x="308.3333333333333" y="162.5" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">370</text>
<text x="308.3333333333333" y="277" font-size="12" font-weight="400" fill="#25402f" text-anchor="middle">Álcool + energ.</text>
<rect x="386" y="70" width="360" height="230" rx="12" fill="#ffffff" stroke="#b9d3c3" stroke-width="2"/>
<text x="400" y="92" font-size="13" font-weight="700" fill="#5d7a69" text-anchor="start">Alerta percebido (0–10), autorreferido</text>
<line x1="420" y1="260" x2="730" y2="260" stroke="#5d7a69" stroke-width="1.5" stroke-linecap="round"/>
<line x1="420" y1="260" x2="730" y2="260" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="414" y="264" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">0</text>
<line x1="420" y1="230" x2="730" y2="230" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="414" y="234" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">2</text>
<line x1="420" y1="200" x2="730" y2="200" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="414" y="204" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">4</text>
<line x1="420" y1="170" x2="730" y2="170" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="414" y="174" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">6</text>
<line x1="420" y1="140" x2="730" y2="140" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="414" y="144" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">8</text>
<line x1="420" y1="110" x2="730" y2="110" stroke="#e3ebe6" stroke-width="1" stroke-linecap="round"/>
<text x="414" y="114" font-size="11" font-weight="400" fill="#5d7a69" text-anchor="end">10</text>
<rect x="450.6666666666667" y="182" width="42" height="78" rx="3" fill="#9aa5ab" stroke="none" stroke-width="1"/>
<text x="471.6666666666667" y="177" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">5,2</text>
<text x="471.6666666666667" y="277" font-size="12" font-weight="400" fill="#25402f" text-anchor="middle">Controle</text>
<rect x="554" y="213.5" width="42" height="46.5" rx="3" fill="#c0392b" stroke="none" stroke-width="1"/>
<text x="575" y="208.5" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">3,1</text>
<text x="575" y="277" font-size="12" font-weight="400" fill="#25402f" text-anchor="middle">Álcool</text>
<rect x="657.3333333333333" y="152" width="42" height="108" rx="3" fill="#e07b39" stroke="none" stroke-width="1"/>
<text x="678.3333333333333" y="147" font-size="11" font-weight="700" fill="#25402f" text-anchor="middle">7,2</text>
<text x="678.3333333333333" y="277" font-size="12" font-weight="400" fill="#25402f" text-anchor="middle">Álcool + energ.</text>
<text x="380" y="322" font-size="12" font-weight="400" fill="#5d7a69" text-anchor="middle" font-style="italic">A escala de alerta não mede diretamente a coordenação motora.</text>
</svg>
