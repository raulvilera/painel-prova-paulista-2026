<text x="460" y="188" font-size="13" font-weight="400" fill="#25402f" text-anchor="end">Amido</text>
<rect x="468" y="161" width="150" height="44" rx="4" fill="#e07b39" stroke="none" stroke-width="1"/>
<text x="624" y="188" font-size="13" font-weight="700" fill="#25402f" text-anchor="start">18</text>
