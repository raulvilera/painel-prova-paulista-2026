<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="Segoe UI,Arial,sans-serif">
<title>Ensaio com enzimas digestivas</title>
<desc>Três tubos com glicose, amido e amido com fibra e gráfico de barras dos açúcares liberados.</desc>
