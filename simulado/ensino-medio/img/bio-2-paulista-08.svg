<text x="262" y="262" font-size="12" font-weight="700" fill="#25402f" text-anchor="middle">Amido + fibra</text>
<text x="165" y="290" font-size="12" font-weight="400" fill="#5d7a69" text-anchor="middle">+ enzimas digestivas · 20 min</text>
