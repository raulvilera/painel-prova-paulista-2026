<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="Segoe UI,Arial,sans-serif">
<title>Três formas de consumo de nicotina</title>
<desc>Três cartões: cigarro convencional, narguilé e cigarro eletrônico, com combustão e nicotina.</desc>
<rect width="760" height="340" fill="#eef6f1"/>
<rect x="10" y="8" width="740" height="50" rx="12" fill="#1f6f4a"/><text x="28" y="31" font-size="19" font-weight="700" fill="#fff">Três formas de consumo de nicotina</text><text x="28" y="49" font-size="12.5" fill="#d8efe2">Dispositivos diferem na combustão e na composição do que é inalado</text>
<rect x="14" y="72" width="235" height="235" rx="12" fill="#ffffff" stroke="#b9d3c3" stroke-width="2"/>
<rect x="54" y="130" width="130" height="14" rx="6" fill="#f1e3c6" stroke="#b99b62" stroke-width="2"/>
<rect x="54" y="130" width="30" height="14" rx="6" fill="#d98c3a" stroke="none" stroke-width="1"/>
<circle cx="192" cy="120" r="8" fill="#cfd8dc" stroke="none" stroke-width="1"/>
<circle cx="204" cy="100" r="11" fill="#dfe6e9" stroke="none" stroke-width="1"/>
<text x="131" y="100" font-size="14" font-weight="400" fill="#25402f" text-anchor="start"></text>
<text x="131" y="232" font-size="15" font-weight="700" fill="#25402f" text-anchor="middle">Cigarro convencional</text>
<text x="131" y="254" font-size="12" font-weight="400" fill="#5d7a69" text-anchor="middle">combustão do tabaco</text>
<text x="131" y="292" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">nicotina presente</text>
<rect x="261" y="72" width="235" height="235" rx="12" fill="#ffffff" stroke="#b9d3c3" stroke-width="2"/>
<rect x="353" y="145" width="50" height="60" rx="10" fill="#8ecae6" stroke="#546e7a" stroke-width="2.5"/>
<rect x="369" y="100" width="18" height="48" rx="0" fill="#b0bec5" stroke="#546e7a" stroke-width="2"/>
<circle cx="378" cy="92" r="14" fill="#8d6e63" stroke="none" stroke-width="1"/>
<path d="M403 175 q40 -10 40 -50" fill="none" stroke="#546e7a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text x="378" y="100" font-size="14" font-weight="400" fill="#25402f" text-anchor="start"></text>
<text x="378" y="232" font-size="15" font-weight="700" fill="#25402f" text-anchor="middle">Narguilé</text>
<text x="378" y="254" font-size="12" font-weight="400" fill="#5d7a69" text-anchor="middle">combustão do carvão e do tabaco</text>
<text x="378" y="270" font-size="12" font-weight="400" fill="#5d7a69" text-anchor="middle">aromatizado</text>
<text x="378" y="292" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">nicotina pode estar presente</text>
<rect x="508" y="72" width="235" height="235" rx="12" fill="#ffffff" stroke="#b9d3c3" stroke-width="2"/>
<rect x="558" y="130" width="120" height="22" rx="11" fill="#cfd8dc" stroke="#546e7a" stroke-width="2.5"/>
<rect x="558" y="130" width="40" height="22" rx="11" fill="#37474f" stroke="none" stroke-width="1"/>
<circle cx="686" cy="122" r="8" fill="#e3f2fd" stroke="none" stroke-width="1"/>
<circle cx="700" cy="104" r="11" fill="#e3f2fd" stroke="none" stroke-width="1"/>
<text x="625" y="100" font-size="14" font-weight="400" fill="#25402f" text-anchor="start"></text>
<text x="625" y="232" font-size="15" font-weight="700" fill="#25402f" text-anchor="middle">Cigarro eletrônico</text>
<text x="625" y="254" font-size="12" font-weight="400" fill="#5d7a69" text-anchor="middle">aquecimento de líquido (sem</text>
<text x="625" y="270" font-size="12" font-weight="400" fill="#5d7a69" text-anchor="middle">combustão)</text>
<text x="625" y="292" font-size="12.5" font-weight="700" fill="#c0392b" text-anchor="middle">nicotina pode estar presente</text>
</svg>
