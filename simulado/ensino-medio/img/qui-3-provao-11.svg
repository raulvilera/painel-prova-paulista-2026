<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="Segoe UI,Arial,sans-serif">
<title>Eletrólise de Cu²⁺(aq)</title>
<desc>Célula eletrolítica com solução de íons cobre ligada a uma fonte, com corrente de 1,93 A durante 1000 s.</desc>
<rect width="760" height="340" fill="#eef4fa"/>
