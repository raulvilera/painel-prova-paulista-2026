<text x="456" y="210" font-size="12" font-weight="400" fill="#5a7186" text-anchor="start">M(Cu)</text>
<text x="456" y="228" font-size="16" font-weight="700" fill="#1f3347" text-anchor="start">63,5 g/mol</text>
<text x="456" y="254" font-size="12" font-weight="400" fill="#5a7186" text-anchor="start">F</text>
<text x="456" y="272" font-size="16" font-weight="700" fill="#1f3347" text-anchor="start">9,65 × 10⁴ C/mol de e⁻</text>
