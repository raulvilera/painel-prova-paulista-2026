<text x="456" y="166" font-size="12" font-weight="400" fill="#5a7186" text-anchor="start">Cátodo (modelo)</text>
<text x="456" y="184" font-size="15" font-weight="700" fill="#1f3347" text-anchor="start">Cu²⁺ + 2e⁻ → Cu</text>
<text x="456" y="210" font-size="12" font-weight="400" fill="#5a7186" text-anchor="start">Ânodo (modelo)</text>
<text x="456" y="228" font-size="15" font-weight="700" fill="#1f3347" text-anchor="start">Cl⁻ descarregado</text>
<text x="456" y="254" font-size="12" font-weight="400" fill="#5a7186" text-anchor="start">Constante de Faraday</text>
<text x="456" y="272" font-size="15" font-weight="700" fill="#1f3347" text-anchor="start">9,65 × 10⁴ C·mol⁻¹ de e⁻</text>
