<text x="327" y="322" font-size="12" font-weight="400" fill="#1f3347" text-anchor="middle">eletrodo inerte</text>
<path d="M157 96 L157 70 L190 70" fill="none" stroke="#37474f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M327 96 L327 70 L290 70" fill="none" stroke="#37474f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
