<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" font-family="Segoe UI,Arial,sans-serif">
<title>Eletrólise aquosa de CuCl₂ com eletrodos inertes</title>
<desc>Célula eletrolítica com solução de CuCl2, dois eletrodos inertes ligados a um gerador e dados do problema.</desc>
<rect width="760" height="340" fill="#eef4fa"/>
