<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Quiz ao vivo · Ciências</title>
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#17231c;--mut:#5d6b62;--line:#d9e0da;--pri:#165c36;--ok:#1e7d3c;--okbg:#e3f4e7;--err:#b3261e;--errbg:#fbe6e4;
  --warnbg:#fff4d6;--a0:#e21b3c;--a1:#1368ce;--a2:#b7860b;--a3:#26890c;--a4:#864cbf}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101612;--card:#18211b;--ink:#e8efe9;--mut:#9fb0a5;--line:#2c3a31;--pri:#5cc08a;--ok:#6fd38f;--okbg:#173322;--err:#ff8a80;--errbg:#3a1b19;--warnbg:#3a3015}}
:root[data-theme="dark"]{--bg:#101612;--card:#18211b;--ink:#e8efe9;--mut:#9fb0a5;--line:#2c3a31;--pri:#5cc08a;--ok:#6fd38f;--okbg:#173322;--err:#ff8a80;--errbg:#3a1b19;--warnbg:#3a3015}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 "Segoe UI",Roboto,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
h1{margin:0;font-size:1.25rem;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.muted{color:var(--mut)}.sm{font-size:.88rem}
label{display:block;font-weight:600;margin:10px 0 6px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:1.1rem}
#pin{font-size:1.8rem;letter-spacing:.2em;text-align:center;font-weight:800}
.btn{display:block;width:100%;margin-top:14px;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:1.05rem;cursor:pointer}
.btn:disabled{opacity:.5}
.msg{margin-top:10px;color:var(--err);min-height:1.2em}
.big{font-size:1.5rem;font-weight:800;text-align:center;margin:8px 0}
.centro{text-align:center}
.alts{display:grid;gap:10px;margin-top:12px}
.alt{display:flex;gap:12px;align-items:center;text-align:left;border:0;border-radius:14px;padding:14px;color:#fff;font-weight:600;min-height:64px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.alt .f{flex:none;font-size:1.5rem;width:1.4em;text-align:center}
.alt:active{transform:translateY(2px)}
.alt:disabled{opacity:.35}
.alt.minha{opacity:1;outline:4px solid var(--ink)}
.timer{font-weight:800;font-variant-numeric:tabular-nums}
.res{border-radius:16px;padding:24px;text-align:center;font-size:1.25rem;font-weight:800}
.res.ok{background:var(--okbg);color:var(--ok)}.res.no{background:var(--errbg);color:var(--err)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--pri);margin:16px auto;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.enun{margin:10px 0}
.com{font-weight:800;margin:12px 0 4px}
figure.infog{margin:10px 0;background:#fff;color:#17231c;border:1px solid var(--line);border-radius:10px;padding:6px;overflow:auto}
figure.infog figcaption{font-weight:700;font-size:.9rem;margin-bottom:4px}
figure.infog table{border-collapse:collapse;width:100%;font-size:.85rem}
figure.infog th,figure.infog td{border:1px solid #cfd8d2;padding:4px 6px;text-align:left}
figure.infog th{background:#eef4ef}
figure.ilus svg{display:block;width:100%;height:auto}
.bars .b{display:grid;grid-template-columns:minmax(70px,32%) 1fr auto;gap:6px;align-items:center;font-size:.85rem;margin:3px 0}
.bars .bt{background:#e4ebe6;border-radius:4px;height:12px;overflow:hidden}.bars .bt i{display:block;height:100%;background:#2f6fb5}
.campo{position:relative;margin-top:12px;border-radius:16px;overflow:hidden;aspect-ratio:16/10;background:#0d1b2a}
.campo #c3d{position:absolute;inset:0}
.golTxt{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:2.6rem;font-weight:900;color:#fff;text-shadow:0 3px 12px rgba(0,0,0,.7);opacity:0;transform:scale(.6);transition:all .35s}
.golTxt.on{opacity:1;transform:scale(1)}
.placar{display:flex;align-items:center;justify-content:center;gap:10px;background:#0d1b2a;color:#fff;border-radius:12px;padding:8px 10px;margin:8px 0;font-weight:800}
.placar .t{flex:1;font-size:.9rem;display:flex;align-items:center;gap:6px}.placar .t:last-child{justify-content:flex-end;text-align:right}
.placar .c{width:12px;height:12px;border-radius:3px;flex:none}
.placar .g{font-size:1.6rem;font-variant-numeric:tabular-nums}
.dup{background:var(--warnbg,#fff4d6);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:.95rem}
.barra{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}.barra i{display:block;height:100%;background:var(--pri);transition:width 1s linear}
</style></head>
<body><div class="wrap">
<header><h1>Quiz ao vivo · Ciências</h1><span class="muted sm" id="quem"></span></header>
<main id="tela" class="card" aria-live="polite"></main>
<div id="campo" class="campo" hidden><div id="c3d"></div><div class="golTxt" id="golTxt"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="estadio3d.js?v=1"></script>
<script src="/aluno-acesso.js" defer></script>
<script>
(function(){
  const SB = 'https://oxohpnappygkmwjyowvq.supabase.co', KEY = 'sb_publishable_EjJenZkxMWv_I6vXWTz6aQ_iz9XEU4N';
  const FORMAS = ['▲', '◆', '●', '■', '★'], LETRA = 'ABCDE';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const SAVE = 'quiz_aluno_v1';
  let EU = null, timer = null;
  const ler = () => { try { return JSON.parse(localStorage.getItem(SAVE) || 'null'); } catch (e) { return null; } };
  const gravar = v => { try { v ? localStorage.setItem(SAVE, JSON.stringify(v)) : localStorage.removeItem(SAVE); } catch (e) {} };

  async function rpc(fn, args) {
    const r = await fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
    if (!r.ok) throw new Error('Sem conexão com o jogo (' + r.status + ')');
    return r.json();
  }
  const tela = h => { $('tela').innerHTML = h; };

  /* ---------- entrar ---------- */
  function telaPin(erro, pin) {
    clearInterval(timer); $('quem').textContent = '';
    tela(`<label for="pin">PIN do jogo</label><input id="pin" inputmode="numeric" maxlength="6" autocomplete="off" value="${esc(pin || '')}" placeholder="000000">
      <button class="btn" id="bPin">Continuar</button><div class="msg">${esc(erro || '')}</div>
      <p class="muted sm">O PIN aparece na tela projetada pelo professor.</p>`);
    $('bPin').onclick = () => { const p = $('pin').value.replace(/\D/g, ''); if (p.length === 6) telaNome(p); };
    $('pin').onkeydown = e => { if (e.key === 'Enter') $('bPin').click(); };
  }
  /* O nome vem do login do aluno (RA + dígito + senha); a lista pública de nomes foi desligada. */
  async function telaNome(pin) {
    tela('<div class="spin"></div><p class="centro muted">Confirmando o seu acesso…</p>');
    const token = await window.alunoAcesso.exigir();
    tela('<div class="spin"></div><p class="centro muted">Procurando o jogo…</p>');
    let r; try { r = await rpc('quiz_entrar_aluno', { p_pin: pin, p_token: token }); } catch (e) { return telaPin(e.message, pin); }
    if (!r.ok) return telaPin(r.erro, pin);
    EU = { pin, token: r.token, nome: r.nome }; gravar(EU); comecar();
  }

  /* ---------- jogo: depois que o professor libera, cada aluno avança no próprio ritmo ---------- */
  function figura(f) {
    if (!f) return '';
    const cap = f.titulo ? `<figcaption>${esc(f.titulo)}</figcaption>` : '';
    if (f.tipo === 'tabela') return `<figure class="infog">${cap}<table><thead><tr>${f.colunas.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${f.linhas.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></figure>`;
    if (f.tipo === 'barras') { const max = Math.max(...f.itens.map(i => i.valor)) || 1; return `<figure class="infog">${cap}<div class="bars">${f.itens.map(i => `<div class="b"><span>${esc(i.rotulo)}</span><span class="bt"><i style="width:${Math.max(3, i.valor / max * 100)}%"></i></span><span>${esc(String(i.valor).replace('.', ','))}${f.unidade ? ' ' + esc(f.unidade) : ''}</span></div>`).join('')}</div></figure>`; }
    if (f.tipo === 'etapas') return `<figure class="infog">${cap}<ol style="margin:0;padding-left:1.3em">${f.etapas.map(e => `<li>${esc(e)}</li>`).join('')}</ol></figure>`;
    return '';
  }
  let relogio = null, qMostrada = -1;
  const parar = () => { clearInterval(timer); clearInterval(relogio); timer = relogio = null; };
  function comecar() { $('quem').textContent = EU.nome; qMostrada = -1; atualizar(); }
  function aguardar(ms) { parar(); timer = setInterval(atualizar, ms); }

  const dupla = s => s.parceiros && s.parceiros.length ? s.parceiros.map(x => esc(x.nome)).join(' e ') : '';
  const TIME = g => (window.Estadio3D ? Estadio3D.time(g) : { nome: 'Time ' + g, cor: '#165c36' });
  const placar = s => s.grupo && s.adv ? `<div class="placar"><span class="t"><i class="c" style="background:${TIME(s.grupo).cor}"></i>${esc(TIME(s.grupo).nome)}</span><span class="g">${s.gols} × ${s.golsAdv}</span><span class="t">${esc(TIME(s.adv).nome)}<i class="c" style="background:${TIME(s.adv).cor}"></i></span></div>` : '';
  let ultimoS = null;
  const linhaDupla = s => s.parceiros && s.parceiros.length ? `<div class="dup">👥 Dupla com <b>${dupla(s)}</b>${s.estado === 'aberto' ? ' · ' + s.parceiros.map(x => `pergunta ${Math.min(x.q + 1, s.n)} de ${s.n}`).join(', ') : ''}<br><span class="sm">Dupla: <b>${s.grupoTotal || 0} pts</b> · ${s.grupoPos}º de ${s.grupos}${s.grupoBonus ? ` · bônus +${s.grupoBonus}` : ''}</span></div>` : '';

  async function atualizar() {
    let s; try { s = await rpc('quiz_estado', { p_pin: EU.pin, p_token: EU.token }); } catch (e) { if (!timer) aguardar(3000); return; }   // rede instável: tenta de novo
    if (s.ok) ultimoS = s;
    if (!s.ok) { parar(); gravar(null); EU = null; return telaPin(s.saiu ? 'Você saiu do jogo. Entre de novo com o PIN.' : s.erro); }
    if (s.estado === 'fim') { parar(); gravar(null); return tela(`<div class="big">Fim de jogo!</div>${placar(s)}${s.grupo && s.adv ? `<p class="centro" style="font-size:1.2rem">${s.gols > s.golsAdv ? '🏆 Vitória do ' + esc(TIME(s.grupo).nome) + '!' : s.gols === s.golsAdv ? 'Empate!' : 'Vitória do ' + esc(TIME(s.adv).nome) + '. Fica para a próxima!'}</p>` : ''}${s.grupo ? `<p class="centro" style="font-size:1.3rem">Sua dupla com <b>${dupla(s)}</b> ficou em <b>${s.grupoPos}º lugar</b> de ${s.grupos}, com <b>${s.grupoTotal} pontos</b>.</p>` : ''}<p class="centro">Você: <b>${s.pontos} pontos</b> e <b>${s.acertos} de ${s.n}</b> acertos (${s.posicao}º de ${s.jogadores}).</p><p class="centro muted">Obrigado por jogar!</p>`); }
    if (s.estado === 'espera') { if (!timer) aguardar(2500); return tela(`<div class="big">Você está no jogo! 🎉</div><p class="centro">Aguarde o professor liberar o quiz. As perguntas vão aparecer aqui.</p>${s.parceiros && s.parceiros.length ? `<div class="dup centro">⚽ Seu time: <b style="color:${TIME(s.grupo).cor}">${esc(TIME(s.grupo).nome)}</b>${s.adv ? ` · adversário: <b>${esc(TIME(s.adv).nome)}</b>` : ''}<br>👥 Você joga em dupla com <b>${dupla(s)}</b>. Sentem juntos: cada um responde no seu celular, mas vocês podem conversar e se ajudar. Cada pergunta que alguém do time acerta vale 1 gol; se os dois acertam, é gol de placa: +1 gol (e +300 pontos de bônus).</div>` : ''}<div class="spin"></div><p class="centro muted sm">${s.jogadores} na sala</p>`); }
    if (s.q >= s.n || !s.pergunta) { if (!timer) aguardar(5000); return tela(`<div class="big">Você terminou! ✅</div><p class="centro" style="font-size:1.2rem"><b>${s.acertos} de ${s.n}</b> acertos · <b>${s.pontos} pontos</b></p><p class="centro">Agora você está em <b>${s.posicao}º lugar</b> de ${s.jogadores}. ${s.parceiros && s.parceiros.length ? 'Ajude sua dupla a terminar: conversem sobre as perguntas!' : ''} Aguarde o professor encerrar o jogo.</p>${linhaDupla(s)}${placar(s)}<div class="spin"></div>`); }
    parar();
    if (qMostrada === s.q) { setTimeout(atualizar, 1200); return; }   // o servidor ainda não fechou a pergunta anterior: confere de novo
    qMostrada = s.q; pergunta(s);
  }

  function pergunta(s) {
    const p = s.pergunta, total = s.tempo * 1000; let fimEm = Date.now() + s.restante, respondida = false;
    tela(`<div class="top"><span class="muted">Pergunta ${s.q + 1} de ${s.n}</span><span><b>${s.pontos}</b> pontos</span></div>
      <div class="top" style="margin-top:4px"><span class="muted sm">${p.bim ? esc(p.bim) + 'º bim. · ' : ''}${esc(p.hab || '')}</span><span class="timer" id="tmr"></span></div>
      <div class="barra"><i id="br" style="width:${s.restante / total * 100}%"></i></div>${placar(s)}${linhaDupla(s)}
      <div class="enun">${esc(p.enunciado || '')}</div>
      ${p.svg ? `<figure class="infog ilus" role="img" aria-label="Ilustração da questão">${p.svg}</figure>` : ''}${figura(p.figura)}
      <p class="com">${esc(p.comando || 'Escolha a resposta certa.')}</p>
      <div class="alts">${p.alts.map((a, i) => `<button class="alt" data-i="${i}" style="background:var(--a${i})"><span class="f">${FORMAS[i]}</span><span>${LETRA[i]}) ${esc(a)}</span></button>`).join('')}</div><div class="msg" id="m"></div>`);
    window.scrollTo(0, 0);
    const tick = () => {
      const r = Math.max(0, fimEm - Date.now()); const t = $('tmr'), b = $('br');
      if (t) t.textContent = '⏱ ' + Math.ceil(r / 1000) + ' s'; if (b) b.style.width = (r / total * 100) + '%';
      if (r <= 0 && !respondida) { respondida = true; clearInterval(relogio); feedback({ tempo: true, certa: false, ganhou: 0 }, s.q); }
    };
    tick(); relogio = setInterval(tick, 250);
    [...document.querySelectorAll('.alt')].forEach(b => b.onclick = async () => {
      if (respondida) return; respondida = true;
      document.querySelectorAll('.alt').forEach(x => { x.disabled = true; }); b.classList.add('minha');
      try {
        const r = await rpc('quiz_responder', { p_pin: EU.pin, p_token: EU.token, p_q: s.q, p_escolha: +b.dataset.i });
        clearInterval(relogio);
        if (!r.ok) { $('m').textContent = r.erro; setTimeout(atualizar, 1500); return; }
        feedback(r, s.q);
      } catch (e) {
        $('m').textContent = 'Falha de conexão. Toque de novo.'; respondida = false; document.querySelectorAll('.alt').forEach(x => { x.disabled = false; }); b.classList.remove('minha');
      }
    });
  }
  let EST = null;
  async function feedback(r, q) {
    clearInterval(relogio);
    const res = r.certa ? 'gol' : r.tempo ? 'fora' : 'defesa', S = ultimoS || {};
    tela(`<div class="res ${r.certa ? 'ok' : 'no'}" style="margin-top:8px">${r.certa ? '✓ Acertou! +' + r.ganhou + ' pontos' : r.tempo ? '⏱ Tempo esgotado' : '✗ Não foi dessa vez'}</div>${r.certa && S.grupo ? '<p class="centro">⚽ Gol do ' + esc(TIME(S.grupo).nome) + '!</p>' : ''}<p class="centro muted">Próxima pergunta em instantes…</p>`);
    let mostrou = false;
    try {
      if (window.Estadio3D && Estadio3D.suportado()) {
        $('campo').hidden = false;
        if (!EST) EST = Estadio3D.criar($('c3d'), { largo: false });
        if (EST) {
          mostrou = true; EST.desenhar();
          const txt = $('golTxt'); txt.textContent = res === 'gol' ? 'GOOOL! ⚽' : res === 'defesa' ? 'Defendeu! 🧤' : 'Pra fora! ⏱'; txt.classList.remove('on');
          setTimeout(() => txt.classList.add('on'), res === 'gol' ? 950 : 800);
          await EST.chute({ resultado: res, corGoleiro: S.adv ? TIME(S.adv).cor : '#1368ce' });
          txt.classList.remove('on');
        }
      }
    } catch (e) { /* sem 3D: segue normalmente */ }
    $('campo').hidden = true;
    setTimeout(() => { qMostrada = q; atualizar(); }, mostrou ? 200 : 2200);
  }


  const sv = ler(), pinUrl = (new URLSearchParams(location.search).get('pin') || '').replace(/\D/g, '');
  if (sv && sv.token && (!pinUrl || pinUrl === sv.pin)) { EU = sv; comecar(); }
  else if (pinUrl.length === 6) telaNome(pinUrl);
  else telaPin('', '');
})();
</script>
</body></html>
